name: SignalBoard v1.2.1 Static Preview Fix (Zero AI)

on:
  push:
    branches: [codex/opportunity-engine-v12-preview]
    paths:
      - ".github/workflows/opportunity-v121-static-fix.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENABLED: "false"
      AI_DRY_RUN: "false"
      AI_MAX_COST_PER_RUN_USD: "0"
      AI_MAX_DAILY_COST_USD: "0"
      AI_MAX_CALLS_PER_RUN: "0"
      ALLOW_EXPENSIVE_AI_JOB: "false"
      AI_RUN_ID: static-fix-${{ github.run_id }}
      AI_LEDGER_DB_PATH: /workspace/data/signalboard_full.db

    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/opportunity-engine-v12-preview
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore Preview and run regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pytest requests
          gzip -t data/signalboard.db.gz
          gzip -cd data/signalboard.db.gz > data/signalboard_full.db
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace
          env AI_MAX_CALLS_PER_RUN=20 AI_MAX_COST_PER_RUN_USD=1 AI_MAX_DAILY_COST_USD=1 \
            CLAIM_MAX_COST_PER_RUN=1 ANALYST_MAX_COST_PER_RUN=1 \
            python -m pytest -q tests/test_opportunity_engine_v12.py tests/test_ai_guardrails.py tests/test_research_engine.py
      - name: Rebuild static Dashboard with AI disabled
        env:
          SIGNALBOARD_DB: /workspace/data/signalboard_full.db
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/dashboard/build_dashboard.py
          test -s scripts/dashboard/dashboard.html
          ! grep -q '__OPPORTUNITY_' scripts/dashboard/dashboard.html
          mkdir -p dashboard_deploy_dist/opportunities
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/index.html
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/opportunities/index.html
          cp scripts/dashboard/dashboard.html dashboard.html
          python - <<'PY'
          import os, sqlite3
          con = sqlite3.connect("data/signalboard_full.db")
          calls = con.execute(
              "SELECT COUNT(*) FROM ai_usage_ledger WHERE run_id=? AND status IN ('PENDING','SUCCESS','FAILED','CANCELLED','UNKNOWN_COST')",
              (os.environ["AI_RUN_ID"],),
          ).fetchone()[0]
          assert calls == 0, calls
          print("OPENAI_CALLS=0 OPENAI_COST_USD=0")
          con.close()
          PY
      - name: Save static Preview
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name signalboard-bot
          git config user.email signalboard-bot@users.noreply.github.com
          git add dashboard.html scripts/dashboard/dashboard.html
          git add -f dashboard_deploy_dist/index.html dashboard_deploy_dist/opportunities/index.html
          git commit -m "Fix unknown-author Feed rendering [zero AI] [skip daily]"
          git push origin HEAD:codex/opportunity-engine-v12-preview
