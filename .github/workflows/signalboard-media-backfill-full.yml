name: Signalboard Full Historical Media Backfill

on:
  push:
    branches: [agent/signalboard-media-backfill-full-trigger]

permissions:
  contents: write

concurrency:
  group: signalboard-data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MEDIA_BACKFILL_BATCH_SIZE: "30"
      MEDIA_BACKFILL_MAX_BATCHES: "12"
      AI_ROUTE_MEDIA_UNDERSTANDING_MODEL: gpt-5.6-terra
      AI_ROUTE_THEME_CANONICALIZATION_MODEL: gpt-5.6-terra
      AI_ROUTE_CLAIM_VERIFICATION_MODEL: gpt-5.6-terra
      AI_ROUTE_THESIS_UPDATE_MODEL: gpt-5.6-terra
      AI_ROUTE_AI_ANALYST_MODEL: gpt-5.6-terra
      AI_ROUTE_CROSS_AUTHOR_ANALYSIS_MODEL: gpt-5.6-terra
      AI_ROUTE_RESEARCH_CASE_SYNTHESIS_MODEL: gpt-5.6-terra
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Restore production database
        run: |
          set -Eeuo pipefail
          gzip -t data/signalboard.db.gz
          gzip -cd data/signalboard.db.gz > data/signalboard_full.db
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace
      - name: Analyze bounded batches with durable checkpoints
        run: |
          set -Eeuo pipefail
          git config user.name signalboard-bot
          git config user.email signalboard-bot@users.noreply.github.com
          for batch in $(seq 1 "$MEDIA_BACKFILL_MAX_BATCHES"); do
            before=$(python - <<'PY'
          import sqlite3
          con = sqlite3.connect('data/signalboard_full.db')
          print(con.execute("""
            SELECT COUNT(*)
            FROM media_assets m
            LEFT JOIN media_analyses a ON a.media_id=m.media_id
            WHERE a.media_id IS NULL
              AND m.analysis_status IN ('pending','error','FAILED_RETRYABLE')
              AND m.media_type IN ('photo','image','animated_gif')
          """).fetchone()[0])
          PY
          )
            if [ "$before" -eq 0 ]; then
              echo "All eligible historical media analyzed after $((batch - 1)) batches."
              break
            fi
            echo "Batch $batch/$MEDIA_BACKFILL_MAX_BATCHES: pending=$before"
            python scripts/intel_media_analyze.py --db data/signalboard_full.db --limit "$MEDIA_BACKFILL_BATCH_SIZE"
            python scripts/intel_source_dedup.py --db data/signalboard_full.db
            gzip -c data/signalboard_full.db > data/signalboard.db.gz.new
            gzip -t data/signalboard.db.gz.new
            mv data/signalboard.db.gz.new data/signalboard.db.gz
            git add data/signalboard.db.gz
            if ! git diff --cached --quiet; then
              git commit -m "Media backfill batch $batch [skip daily]"
              git push origin HEAD:master
            fi
          done
      - name: Integrate new media evidence
        run: |
          set -Eeuo pipefail
          python scripts/intel_source_dedup.py --db data/signalboard_full.db --resolve-redirects
          python scripts/intel_theme_canonicalize.py --db data/signalboard_full.db --apply --max-pairs 240
          python scripts/intel_claim_verify.py --db data/signalboard_full.db --limit 40
          python scripts/intel_thesis_update.py --db data/signalboard_full.db --limit 30
          python scripts/intel_ai_analyst.py --db data/signalboard_full.db --limit 30
          python scripts/intel_case_synthesis.py --db data/signalboard_full.db
          python scripts/intel_golden_tests.py --db data/signalboard_full.db --require-pass
          python scripts/intel_v11_report.py --db data/signalboard_full.db
          python scripts/dashboard/build_dashboard.py
          cp scripts/dashboard/dashboard.html dashboard.html
          mkdir -p dashboard_deploy_dist
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/index.html
      - name: Persist integrated evidence and dashboard
        run: |
          set -Eeuo pipefail
          gzip -c data/signalboard_full.db > data/signalboard.db.gz.new
          gzip -t data/signalboard.db.gz.new
          mv data/signalboard.db.gz.new data/signalboard.db.gz
          git add data/signalboard.db.gz scripts/dashboard/dashboard.html dashboard.html
          git add -f dashboard_deploy_dist/index.html outputs/thesis_engine_v11/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Complete historical media evidence integration [skip daily]"
            git push origin HEAD:master
          fi
      - name: Upload final backfill audit
        uses: actions/upload-artifact@v6
        with:
          name: signalboard-full-media-backfill-audit
          path: outputs/thesis_engine_v11/*.json
          if-no-files-found: error
