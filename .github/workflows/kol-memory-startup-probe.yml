name: KOL Memory Startup Low-Cost Probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/discover_memory_startup_kols.py"
      - "tests/test_memory_startup_probe.py"
      - ".github/workflows/kol-memory-startup-probe.yml"

permissions:
  contents: write

concurrency:
  group: kol-memory-startup-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 5

      - name: Verify required inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${APIFY_TOKEN:-}" || { echo "::error::Missing APIFY_TOKEN"; exit 1; }
          test -n "${DEEPSEEK_API_KEY:-}" || { echo "::error::Missing DEEPSEEK_API_KEY"; exit 1; }
          gzip -t data/signalboard.db.gz

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check requests apify-client pytest

      - name: Run regression tests
        run: pytest -q tests/test_memory_startup_probe.py

      - name: Run capped probe
        run: |
          python scripts/discover_memory_startup_kols.py \
            --db-gz data/signalboard.db.gz \
            --output-dir outputs/memory_startup_probe_20260811

      - name: Validate probe outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/memory_startup_probe_20260811/probe.json")
          d = json.loads(p.read_text())
          assert d["discovery_only"] is True
          assert d["discovery_window"] == ["2025-04-07", "2025-09-11"]
          assert "excluded" in d["validation_rule"].lower()
          assert len(d["query_stats"]) == 8
          assert d["stats"]["unique_posts"] > 0
          print(d["stats"])
          PY

      - name: Commit probe report and reusable raw data
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
          git add outputs/memory_startup_probe_20260811/probe.json
          git add outputs/memory_startup_probe_20260811/report.md
          git add outputs/memory_startup_probe_20260811/raw_posts.json.gz
          git commit -m "Add memory-startup low-cost probe results"
          git pull --rebase origin master
          git push origin HEAD:master
