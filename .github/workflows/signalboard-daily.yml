name: Signalboard Daily Update

on:
  workflow_dispatch:
    inputs:
      ai_enabled:
        description: "Explicitly enable bounded paid AI for this incremental run"
        required: true
        type: boolean
        default: false
      ai_dry_run:
        description: "Estimate paid AI calls without sending them"
        required: true
        type: boolean
        default: true
      max_price_requests:
        description: "Maximum Polygon ticker requests for this manual update"
        required: true
        type: string
        default: "60"
  push:
    branches: [master]
    paths:
      - "scripts/dashboard/**"
      - "scripts/intel_incremental_scrape.py"
      - "scripts/intel_daily_health.py"
      - "scripts/intel_extract.py"
      - "scripts/intel_graph_ingest.py"
      - "scripts/intel_media_analyze.py"
      - "scripts/intel_openai_smoke.py"
      - "scripts/intel_thesis_update.py"
      - "scripts/intel_theme_canonicalize.py"
      - "scripts/intel_source_dedup.py"
      - "scripts/intel_claim_verify.py"
      - "scripts/intel_ai_analyst.py"
      - "scripts/intel_case_synthesis.py"
      - "signalboard/ai/**"
      - "signalboard/research_graph.py"
      - "signalboard/db.py"
      - ".github/workflows/signalboard-daily.yml"
  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Shanghai"
    - cron: "47 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "17 11 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: signalboard-data-write
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout recent master history
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1

      - name: Skip redundant scheduled fallback
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = "push" ] && { [[ "$HEAD_MESSAGE" == *"[skip daily]"* ]] || [[ "$HEAD_MESSAGE" == "Daily Signalboard update "* ]]; }; then
            echo "Self-generated or explicitly skipped push; no production refresh needed."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          latest_subject=$(git log -1 --format=%s)
          if [[ "$latest_subject" == "Daily Signalboard update $today"* ]]; then
            echo "Scheduled update for $today already completed; skipping fallback."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No completed update for $today; running this schedule slot."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: freshness
    if: needs.freshness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      DEEPSEEK_API_KEY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ai_enabled) || contains(github.event.head_commit.message, '[summary backfill]')) && secrets.DEEPSEEK_API_KEY || '' }}
      OPENAI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_enabled && secrets.OPENAI_API_KEY || '' }}
      AI_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_enabled || false }}
      SUMMARY_ENABLED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ai_enabled) || contains(github.event.head_commit.message, '[summary backfill]') }}
      ALLOW_EXPENSIVE_AI_JOB: "false"
      AI_JOB_KIND: incremental_daily
      AI_WORKFLOW: signalboard_daily
      AI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AI_LEDGER_DB_PATH: /workspace/data/signalboard_full.db
      AI_MAX_COST_PER_RUN_USD: "0.50"
      AI_MAX_DAILY_COST_USD: "1.00"
      AI_MAX_CALLS_PER_RUN: "20"
      EXTRACT_MAX_COST_PER_RUN: "0.10"
      MEDIA_MAX_COST_PER_RUN: "0.15"
      THEME_MAX_COST_PER_RUN: "0.10"
      CLAIM_MAX_COST_PER_RUN: "0.20"
      THESIS_MAX_COST_PER_RUN: "0.15"
      ANALYST_MAX_COST_PER_RUN: "0.15"
      GOLDEN_MAX_COST_PER_RUN: "0"
      AI_DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.ai_dry_run }}
      FORCE_REANALYZE: "false"
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      POLYGON_REQUEST_INTERVAL: "13"
      # Scheduled default retained for audit compatibility: POLYGON_MAX_API_REQUESTS: "60"
      POLYGON_MAX_API_REQUESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_price_requests || '60' }}
      MEDIA_AI_MAX_ITEMS: "6"
      THESIS_AI_MAX_UPDATES: "4"
      CLAIM_VERIFY_MAX_ITEMS: "2"
      ANALYST_MAX_ITEMS: "2"
      AI_ROUTE_BULK_POST_PROCESSING_PROVIDER: "deepseek"
      AI_ROUTE_BULK_POST_PROCESSING_MODEL: "deepseek-v4-flash"
      AI_ROUTE_DAILY_SUMMARY_PROVIDER: "deepseek"
      AI_ROUTE_DAILY_SUMMARY_MODEL: "deepseek-v4-flash"
      AI_ROUTE_MEDIA_UNDERSTANDING_PROVIDER: "openai"
      AI_ROUTE_MEDIA_UNDERSTANDING_MODEL: "gpt-5.6-terra"
      AI_ROUTE_MEDIA_UNDERSTANDING_REASONING_EFFORT: "low"
      AI_ROUTE_THESIS_UPDATE_PROVIDER: "openai"
      AI_ROUTE_THESIS_UPDATE_MODEL: "gpt-5.6-terra"
      AI_ROUTE_CROSS_AUTHOR_ANALYSIS_PROVIDER: "openai"
      AI_ROUTE_CROSS_AUTHOR_ANALYSIS_MODEL: "gpt-5.6-terra"
      AI_ROUTE_THEME_CANONICALIZATION_MODEL: "gpt-5.6-terra"
      AI_ROUTE_CLAIM_VERIFICATION_MODEL: "gpt-5.6-terra"
      AI_ROUTE_AI_ANALYST_MODEL: "gpt-5.6-terra"
      AI_ROUTE_RESEARCH_CASE_SYNTHESIS_MODEL: "gpt-5.6-terra"
      AI_ROUTE_DEEP_INVESTMENT_ANALYSIS_PROVIDER: "openai"
      AI_ROUTE_DEEP_INVESTMENT_ANALYSIS_MODEL: "gpt-5.6-sol"

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1

      - name: Verify required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for key in APIFY_TOKEN POLYGON_API_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required repository secret is missing: $key"
              exit 1
            fi
          done
          if [ "$AI_ENABLED" = "true" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required when ai_enabled is enabled"
            exit 1
          fi
          if [ "$AI_ENABLED" = "true" ] && [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY is required when ai_enabled is enabled"
            exit 1
          fi
          if [ "$SUMMARY_ENABLED" = "true" ] && [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY is required when scheduled summaries are enabled"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests apify-client

      - name: Restore and verify database
        shell: bash
        run: |
          set -Eeuo pipefail
          gzip -t data/signalboard.db.gz
          gzip -cd data/signalboard.db.gz > data/signalboard_full.db
          python - <<'PY'
          import sqlite3
          db = "data/signalboard_full.db"
          con = sqlite3.connect(db, timeout=30)
          result = con.execute("PRAGMA quick_check").fetchone()[0]
          if result != "ok":
              raise SystemExit(f"Database check failed: {result}")
          print("raw_posts:", con.execute("SELECT COUNT(*) FROM raw_posts").fetchone()[0])
          print("predictions:", con.execute("SELECT COUNT(*) FROM predictions").fetchone()[0])
          print("verifications:", con.execute("SELECT COUNT(*) FROM verifications").fetchone()[0])
          con.close()
          PY
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace

      - name: Incremental scrape
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs/intel_cron
          pids=()
          names=()
          for kol in jukan05 aleabitoreddit zephyr_z9 austinsemis DGretta_Author FeroceResearch TradexWhisperer gsmferrari; do
            python scripts/intel_incremental_scrape.py --kol "$kol"               > "logs/intel_cron/${kol}.log" 2>&1 &
            pids+=("$!")
            names+=("$kol")
          done
          failures=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::warning::Scrape failed for ${names[$i]}"
              tail -50 "logs/intel_cron/${names[$i]}.log" || true
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -eq 8 ]; then
            echo "::error::All eight scrapers failed"
            exit 1
          fi

      - name: Incremental extraction
        if: env.AI_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          since=$(TZ=Asia/Shanghai date -d "7 days ago" +%Y-%m-%d)
          python scripts/intel_extract.py --since "$since"

      - name: Build recursive Post Graph
        shell: bash
        run: |
          set -Eeuo pipefail
          since=$(TZ=Asia/Shanghai date -d "7 days ago" +%Y-%m-%d)
          python scripts/intel_graph_ingest.py --since "$since"

      - name: One-time recent Claim and Theme backfill
        if: github.event_name == 'workflow_dispatch' && env.AI_ENABLED == 'true' && env.ALLOW_EXPENSIVE_AI_JOB == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          since=$(TZ=Asia/Shanghai date -d "7 days ago" +%Y-%m-%d)
          python scripts/intel_extract.py --since "$since" --claims-missing --limit 120

      - name: Save ingest checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          gzip -c data/signalboard_full.db > data/signalboard.db.gz.new
          gzip -t data/signalboard.db.gz.new
          mv data/signalboard.db.gz.new data/signalboard.db.gz
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
          git add data/signalboard.db.gz
          if git diff --cached --quiet; then
            echo "No ingest changes to checkpoint."
          else
            git commit -m "Checkpoint Signalboard ingest $(TZ=Asia/Shanghai date +%Y-%m-%d) [skip daily]"
            git pull --rebase --autostash origin master
            git push origin HEAD:master
          fi

      - name: Verify OpenAI Responses API and Terra access
        if: env.AI_ENABLED == 'true'
        run: python scripts/intel_openai_smoke.py

      - name: Analyze new Post media
        if: env.AI_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python scripts/intel_media_analyze.py --limit "$MEDIA_AI_MAX_ITEMS"; then
            echo "::warning::Media analysis failed; ingest checkpoint is preserved and pending media will retry next run."
          fi

      - name: Deduplicate underlying sources
        run: python scripts/intel_source_dedup.py

      - name: Audit and canonicalize Themes
        if: env.AI_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python scripts/intel_theme_canonicalize.py --apply --max-pairs 80; then
            echo "::warning::Theme audit failed; existing canonical Themes remain intact and will retry."
          fi

      - name: Verify high-importance claims
        if: env.AI_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python scripts/intel_claim_verify.py --limit "$CLAIM_VERIFY_MAX_ITEMS"; then
            echo "::warning::Claim verification failed; Claims remain UNVERIFIED and will retry."
          fi

      - name: Update Author by Theme theses
        if: env.AI_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python scripts/intel_thesis_update.py --limit "$THESIS_AI_MAX_UPDATES"; then
            echo "::warning::Thesis update failed; claims remain stored and will retry next run."
          fi

      - name: Run independent Terra analyst
        if: env.AI_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python scripts/intel_ai_analyst.py --limit "$ANALYST_MAX_ITEMS"; then
            echo "::warning::AI Analyst failed; Thesis versions remain stored and will retry."
          fi

      - name: Refresh bounded cross-theme research cases
        if: env.AI_ENABLED == 'true' && env.ALLOW_EXPENSIVE_AI_JOB == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python scripts/intel_case_synthesis.py; then
            echo "::warning::Research Case synthesis failed; prior analysis remains available and will retry."
          fi

      - name: One-time low-cost historical call backfill
        # Legacy trigger [backfill-calls-1y] is no longer honored on push.
        # Historical AI work now requires manual dispatch plus the expensive-job gate.
        if: github.event_name == 'workflow_dispatch' && env.AI_ENABLED == 'true' && env.ALLOW_EXPENSIVE_AI_JOB == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/intel_extract.py \
            --since 2025-08-11 \
            --until 2026-05-28 \
            --sources tw_austinsemis,tw_jukan05,tw_zephyr_z9 \
            --ticker-clues-only \
            --max-targets 650

      - name: Database health check
        run: python scripts/intel_daily_health.py

      - name: Refresh prices
        if: ${{ !contains(github.event.head_commit.message, '[summary backfill]') }}
        run: python scripts/dashboard/refresh_prices_polygon.py

      - name: Generate summaries
        if: env.SUMMARY_ENABLED == 'true'
        env:
          # The shared AI guardrail requires AI_ENABLED, but this override is
          # scoped to the DeepSeek summary step only. Full OpenAI jobs above
          # remain gated by the job-level AI_ENABLED value.
          AI_ENABLED: "true"
          AI_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_dry_run || false }}
          AI_MAX_CALLS_PER_RUN: "50"
          AI_MAX_COST_PER_RUN_USD: "0.30"
          EXTRACT_MAX_COST_PER_RUN: "0.30"
        run: python scripts/dashboard/intel_gen_summaries.py

      - name: Build dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/dashboard/build_dashboard.py
          test -s scripts/dashboard/dashboard.html
          test "$(stat -c%s scripts/dashboard/dashboard.html)" -ge 10000
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/dashboard/dashboard.html")
          data = path.read_bytes()
          if not data.startswith(b"<!doctype html>"):
              raise SystemExit("dashboard artifact is not HTML")
          text = data.decode("utf-8")
          if "<html" not in text or "</html>" not in text:
              raise SystemExit("dashboard artifact is incomplete")
          PY
          mkdir -p dashboard_deploy_dist/legacy dashboard_deploy_dist/admin
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/legacy/index.html
          cp scripts/dashboard/admin.template.html dashboard_deploy_dist/admin/index.html
          python scripts/dashboard/build_unified_research_data.py \
            --database data/signalboard_full.db \
            --output dashboard_deploy_dist/data/raw-intelligence.json.gz
          python scripts/dashboard/build_research_clue_preview.py \
            --deploy-root dashboard_deploy_dist
          # The original Signal Desk is the primary product. Research Clues stay
          # available under their dedicated routes and must not replace the home page.
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/index.html
          cp dashboard_deploy_dist/index.html dashboard.html

      - name: Save updated database
        shell: bash
        run: |
          set -Eeuo pipefail
          gzip -c data/signalboard_full.db > data/signalboard.db.gz.new
          gzip -t data/signalboard.db.gz.new
          mv data/signalboard.db.gz.new data/signalboard.db.gz

      - name: Commit daily update
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
          git add data/signalboard.db.gz scripts/dashboard/summaries.json scripts/dashboard/dashboard.html dashboard.html
          git add -f dashboard_deploy_dist/index.html dashboard_deploy_dist/_redirects dashboard_deploy_dist/data/raw-intelligence.json.gz dashboard_deploy_dist/research-clues/index.html dashboard_deploy_dist/research-changes/index.html dashboard_deploy_dist/evidence/index.html dashboard_deploy_dist/companies/index.html dashboard_deploy_dist/posts/index.html dashboard_deploy_dist/authors/index.html dashboard_deploy_dist/themes/index.html dashboard_deploy_dist/tickers/index.html dashboard_deploy_dist/tracking/index.html dashboard_deploy_dist/ai-usage/index.html dashboard_deploy_dist/legacy/index.html dashboard_deploy_dist/admin/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily Signalboard update $(TZ=Asia/Shanghai date +%Y-%m-%d) [skip daily]"
          git stash push --include-untracked --message "workflow generated files before rebase" || true
          git pull --rebase origin master
          git push origin HEAD:master
