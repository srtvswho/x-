name: KOL Memory Top Blind Validation

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/validate_memory_top_candidates.py"
      - ".github/workflows/kol-memory-top-validation.yml"

permissions:
  contents: write

concurrency:
  group: kol-memory-top-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 5

      - name: Verify required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for key in APIFY_TOKEN DEEPSEEK_API_KEY POLYGON_API_KEY; do
            test -n "${!key:-}" || { echo "::error::Missing $key"; exit 1; }
          done

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check requests apify-client

      - name: Run blind validation
        run: |
          python -m py_compile scripts/validate_memory_top_candidates.py
          python scripts/validate_memory_top_candidates.py --output-dir outputs/memory_top_validation_20260811

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("outputs/memory_top_validation_20260811/validation.json").read_text())
          assert d["discovery_window_excluded"] == ["2026-05-15", "2026-07-25"]
          assert d["stats"]["raw_posts"] > 0
          assert d["stats"]["verified_signals"] > 0
          assert len(d["ranking"]) == 12
          print(d["stats"])
          PY

      - name: Commit validation report
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
          git add outputs/memory_top_validation_20260811/validation.json
          git add outputs/memory_top_validation_20260811/report.md
          git commit -m "Add memory-top candidate blind validation"
          git pull --rebase origin master
          git push origin HEAD:master
