name: KOL Ad Hoc Historical Validation

on:
  push:
    branches: [agent/eval-sssjeffpu]
    paths:
      - "scripts/validate_memory_top_candidates.py"
      - ".github/workflows/kol-ad-hoc-validation.yml"

permissions:
  contents: write

concurrency:
  group: kol-ad-hoc-validation-sssjeffpu
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/eval-sssjeffpu

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check requests apify-client

      - name: Validate Jeff Pu
        run: |
          python scripts/validate_memory_top_candidates.py \
            --candidates sssjeffpu \
            --history-from 2025-04-01 \
            --history-to 2026-07-15 \
            --as-of 2026-08-13 \
            --output-dir outputs/kol_validation_sssjeffpu_20260813

      - name: Commit report
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
          git add outputs/kol_validation_sssjeffpu_20260813
          git commit -m "Add Jeff Pu historical validation"
          git push origin HEAD:agent/eval-sssjeffpu
