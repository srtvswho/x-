name: Signalboard Media Backfill

on:
  workflow_dispatch:
    inputs:
      ai_enabled:
        description: "Explicitly enable paid AI"
        required: true
        type: boolean
        default: false
      allow_expensive_ai_job:
        description: "Acknowledge historical media backfill cost"
        required: true
        type: boolean
        default: false
      ai_dry_run:
        description: "Estimate the batch without sending paid AI requests"
        required: true
        type: boolean
        default: true
      batch_size:
        description: "Max unique pending media in this batch"
        required: true
        default: "30"

permissions:
  contents: write

concurrency:
  group: signalboard-data-write
  cancel-in-progress: false

jobs:
  backfill:
    if: inputs.ai_enabled && inputs.allow_expensive_ai_job
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ inputs.ai_enabled && secrets.OPENAI_API_KEY || '' }}
      AI_ENABLED: ${{ inputs.ai_enabled }}
      ALLOW_EXPENSIVE_AI_JOB: ${{ inputs.allow_expensive_ai_job }}
      AI_JOB_KIND: historical_media_backfill
      AI_WORKFLOW: signalboard_media_backfill
      AI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AI_LEDGER_DB_PATH: /workspace/data/signalboard_full.db
      AI_MAX_COST_PER_RUN_USD: "0.50"
      AI_MAX_DAILY_COST_USD: "1.00"
      AI_MAX_CALLS_PER_RUN: "20"
      MEDIA_MAX_COST_PER_RUN: "0.50"
      AI_DRY_RUN: ${{ inputs.ai_dry_run }}
      FORCE_REANALYZE: "false"
      MEDIA_BACKFILL_BATCH_SIZE: ${{ inputs.batch_size }}
      AI_ROUTE_MEDIA_UNDERSTANDING_MODEL: gpt-5.6-terra
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Restore database
        run: |
          gzip -t data/signalboard.db.gz
          gzip -cd data/signalboard.db.gz > data/signalboard_full.db
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace
      - name: Analyze one bounded batch
        run: |
          python scripts/intel_media_analyze.py --limit "$MEDIA_BACKFILL_BATCH_SIZE"
          python scripts/intel_source_dedup.py
          python scripts/intel_v11_report.py
      - name: Persist batch checkpoint
        run: |
          gzip -c data/signalboard_full.db > data/signalboard.db.gz.new
          gzip -t data/signalboard.db.gz.new
          mv data/signalboard.db.gz.new data/signalboard.db.gz
          git config user.name signalboard-bot
          git config user.email signalboard-bot@users.noreply.github.com
          git add data/signalboard.db.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Media backfill batch [skip daily]"
          git push origin HEAD:master
