name: KOL Memory Top Discovery

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/discover_memory_top_kols.py"
      - "tests/test_memory_top_discovery.py"
      - ".github/workflows/kol-memory-top-discovery.yml"

permissions:
  contents: write

concurrency:
  group: kol-memory-top-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 5

      - name: Verify required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for key in APIFY_TOKEN DEEPSEEK_API_KEY POLYGON_API_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required repository secret is missing: $key"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests apify-client pytest

      - name: Validate discovery code
        run: |
          python -m py_compile scripts/discover_memory_top_kols.py
          python -m pytest -q tests/test_memory_top_discovery.py

      - name: Discover candidates
        run: python scripts/discover_memory_top_kols.py --reuse-apify-runs --output-dir outputs/memory_top_discovery_20260811

      - name: Validate outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("outputs/memory_top_discovery_20260811/candidates.json")
          data = json.loads(path.read_text())
          successful_queries = sum("error" not in q for q in data["queries"])
          assert successful_queries >= 8, f"Only {successful_queries}/12 searches succeeded"
          assert data["stats"]["unique_posts"] > 0, "No posts found"
          assert data["discovery_only"] is True
          assert "excluded" in data["validation_exclusion"].lower()
          print(data["stats"])
          PY

      - name: Commit discovery report
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
          git add outputs/memory_top_discovery_20260811/candidates.json
          git add outputs/memory_top_discovery_20260811/report.md
          git commit -m "Add June memory-top KOL discovery results"
          git pull --rebase origin master
          git push origin HEAD:master
