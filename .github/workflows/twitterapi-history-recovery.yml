name: SignalBoard bounded historical timeline capture
on:
  push:
    branches: [master]
    paths: ['.github/workflows/twitterapi-history-recovery.yml']
permissions:
  contents: read
concurrency:
  group: signalboard-data-write
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'srtvswho/x-' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      AI_ENABLED: 'false'
      ALLOW_EXPENSIVE_AI_JOB: 'false'
      AI_DRY_RUN: 'true'
      POLYGON_API_KEY: ''
      HISTORY_RAW_ONLY_APPROVED: 'true'
      HISTORY_REVIEWED_HEAD: ${{ github.sha }}
      SIGNALBOARD_DB: data/signalboard_full.db
    steps:
      - name: Absolute finite cutoff
        id: deadline
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d '2026-11-22 08:10:00' +%s)" ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.deadline.outputs.active == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        if: steps.deadline.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Install existing request dependency
        if: steps.deadline.outputs.active == 'true'
        run: python -m pip install --disable-pip-version-check requests
      - name: Validate reviewed code and current branch
        if: steps.deadline.outputs.active == 'true'
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"
          python -m unittest discover -s tests -p 'test_twitterapi*.py'
          gzip -cd data/signalboard.db.gz > data/signalboard_full.db
      - name: Capture bounded historical timeline to durable journal only
        if: steps.deadline.outputs.active == 'true'
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: python scripts/twitterapi_history_once.py
      - uses: actions/upload-artifact@v6
        if: always() && steps.deadline.outputs.active == 'true'
        with:
          name: timeline-history-receipt-${{ github.run_id }}
          path: recovery_output/history_receipt.json
          if-no-files-found: warn
