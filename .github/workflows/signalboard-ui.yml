name: SignalBoard unified UI
on:
  push:
    branches: [master, codex/unified-navigation-timeline]
    paths:
      - 'scripts/dashboard/**'
      - '.github/workflows/signalboard-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signalboard-data-write
  cancel-in-progress: false
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ui]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Restore the completed data snapshot
        run: gzip -cd data/signalboard.db.gz > data/signalboard_full.db
      - name: Rebuild all views without API calls
        env:
          SIGNALBOARD_DB: ${{ github.workspace }}/data/signalboard_full.db
        run: |
          python scripts/dashboard/build_dashboard.py
          python scripts/dashboard/build_unified_research_data.py --database data/signalboard_full.db --output dashboard_deploy_dist/data/raw-intelligence.json.gz
          python scripts/dashboard/build_research_clue_preview.py --deploy-root dashboard_deploy_dist
          cp dashboard_deploy_dist/index.html dashboard.html
          python scripts/dashboard/validate_unified_app.py
      - name: Save the complete publication snapshot
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name signalboard-bot
          git config user.email signalboard-bot@users.noreply.github.com
          git add scripts/dashboard/dashboard.html dashboard.html
          git add -f dashboard_deploy_dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build unified SignalBoard views [skip daily] [skip ui]'
          git push origin "HEAD:$TARGET_BRANCH"
