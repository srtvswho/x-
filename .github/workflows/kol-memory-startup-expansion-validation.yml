name: KOL Memory Startup Expansion Candidate Validation

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/validate_memory_startup_expansion_candidates.py"
      - "tests/test_memory_startup_expansion_validation.py"
      - ".github/workflows/kol-memory-startup-expansion-validation.yml"

permissions:
  contents: write

concurrency:
  group: kol-memory-startup-expansion-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check requests apify-client pytest

      - name: Verify secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in APIFY_TOKEN DEEPSEEK_API_KEY POLYGON_API_KEY; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done

      - name: Run regression tests
        run: pytest -q tests/test_memory_startup_expansion_validation.py tests/test_startup_light_validation.py

      - name: Run capped out-of-sample light validation
        run: |
          python scripts/validate_memory_startup_expansion_candidates.py \
            --output-dir outputs/memory_startup_expansion_validation_20260811

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/memory_startup_expansion_validation_20260811/validation.json")
          d = json.loads(p.read_text())
          assert d["discovery_window_excluded"] == ["2025-03-01", "2025-10-31"]
          assert len(d["ranking"]) == 6
          assert d["stats"]["raw_posts"] > 0
          assert d["stats"]["verified_events"] > 0
          print(d["stats"])
          PY

      - name: Commit expansion validation results
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
          git add outputs/memory_startup_expansion_validation_20260811/validation.json
          git add outputs/memory_startup_expansion_validation_20260811/report.md
          git commit -m "Add expansion candidate light-validation results"
          git pull --rebase origin master
          git push origin HEAD:master
