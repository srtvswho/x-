name: Signalboard Historical Extraction Repair

on:
  push:
    branches: [master]
    paths: [config/history_repair_campaign.json]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: "Execute the historical repair (false only writes the plan)"
        type: boolean
        default: false
        required: true
      batch_limit:
        description: "Internal checkpoint batch size, 1–500; full run automatically continues"
        type: string
        default: "400"
        required: true

      continuous:
        description: "Continue all remaining historical batches automatically"
        type: boolean
        default: true
        required: true

permissions:
  contents: write

concurrency:
  group: signalboard-data-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEEPSEEK_API_KEY: ${{ (github.event_name != 'workflow_dispatch' || inputs.apply) && secrets.DEEPSEEK_API_KEY || '' }}
      POLYGON_API_KEY: ${{ (github.event_name != 'workflow_dispatch' || inputs.apply) && secrets.POLYGON_API_KEY || '' }}
      AI_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
      AI_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.apply }}
      ALLOW_EXPENSIVE_AI_JOB: "false"
      AI_JOB_KIND: historical_post_extraction
      AI_WORKFLOW: signalboard_history_repair
      AI_RUN_ID: first-call-full-history-20260907
      AI_LEDGER_DB_PATH: /workspace/data/signalboard_full.db
      AI_MAX_CALLS_PER_RUN: "50000"
      AI_MAX_COST_PER_RUN_USD: "30.00"
      AI_MAX_DAILY_COST_USD: "35.00"
      EXTRACT_MAX_COST_PER_RUN: "30.00"
      AI_ROUTE_BULK_POST_PROCESSING_PROVIDER: deepseek
      AI_ROUTE_BULK_POST_PROCESSING_MODEL: deepseek-v4-flash
      FORCE_REANALYZE: "false"
      POLYGON_REQUEST_INTERVAL: "13"
      POLYGON_MAX_API_REQUESTS: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Check campaign eligibility
        id: campaign
        env:
          APPLY: ${{ inputs.apply }}
        run: python scripts/intel_history_campaign.py --gate
      - name: Configure checkpoint author
        if: steps.campaign.outputs.run == 'true'
        run: |
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
      - name: Restore database
        if: steps.campaign.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          gzip -t data/signalboard.db.gz
          gzip -cd data/signalboard.db.gz > data/signalboard_full.db
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace
      - name: Plan or drain full historical extraction
        id: extraction
        if: steps.campaign.outputs.run == 'true'
        env:
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
          CONTINUOUS: ${{ github.event_name != 'workflow_dispatch' || inputs.continuous }}
          BATCH_LIMIT: ${{ inputs.batch_limit || '400' }}
        run: |
          set -Eeuo pipefail
          args=()
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          if [ "$CONTINUOUS" = "true" ]; then args+=(--continuous --checkpoint-git); fi
          python scripts/intel_history_campaign.py --limit "$BATCH_LIMIT" "${args[@]}"
          python - <<'PYOUT'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('outputs/signalboard_history_rebuild_latest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"complete={str(plan['pending_total'] == 0).lower()}\n")
          PYOUT
      - name: Save extraction checkpoint
        if: always() && steps.campaign.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.apply)
        run: |
          set -Eeuo pipefail
          test -s data/signalboard_full.db
          gzip -c data/signalboard_full.db > data/signalboard.db.gz.new
          gzip -t data/signalboard.db.gz.new
          mv data/signalboard.db.gz.new data/signalboard.db.gz
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
          git add data/signalboard.db.gz
          for report in outputs/history_repair_campaign.json outputs/first_call_campaign_*.json; do
            if [ -f "$report" ]; then git add "$report"; fi
          done
          if [ -f outputs/signalboard_history_rebuild_latest.json ]; then
            git add outputs/signalboard_history_rebuild_latest.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint historical extraction repair [skip daily]"
            git push origin HEAD:master
          fi
      - name: Upload coverage and pending batch report
        if: always() && steps.campaign.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: historical-extraction-coverage
          path: |
            outputs/signalboard_history_rebuild_latest.json
            outputs/history_repair_campaign.json
            outputs/first_call_campaign_*.json
      - name: Refresh prices and rebuild dashboard
        if: steps.extraction.outputs.complete == 'true' && steps.campaign.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.apply)
        run: |
          set -Eeuo pipefail
          python scripts/dashboard/refresh_prices_polygon.py
          python scripts/intel_history_campaign.py --audit
          python scripts/dashboard/build_dashboard.py
          test -s scripts/dashboard/dashboard.html
          test "$(stat -c%s scripts/dashboard/dashboard.html)" -ge 10000
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/dashboard/dashboard.html")
          data = path.read_bytes()
          if not data.startswith(b"<!doctype html>"):
              raise SystemExit("dashboard artifact is not HTML")
          text = data.decode("utf-8")
          if "<html" not in text or "</html>" not in text:
              raise SystemExit("dashboard artifact is incomplete")
          PY
          mkdir -p dashboard_deploy_dist/legacy dashboard_deploy_dist/admin
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/legacy/index.html
          cp scripts/dashboard/admin.template.html dashboard_deploy_dist/admin/index.html
          python scripts/dashboard/build_unified_research_data.py \
            --database data/signalboard_full.db \
            --output dashboard_deploy_dist/data/raw-intelligence.json.gz
          python scripts/dashboard/build_research_clue_preview.py \
            --deploy-root dashboard_deploy_dist
          # Keep the original daily intelligence dashboard at the product root.
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/index.html
          cp dashboard_deploy_dist/index.html dashboard.html

      - name: Publish repaired history
        if: steps.extraction.outputs.complete == 'true' && steps.campaign.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.apply)
        run: |
          set -Eeuo pipefail
          gzip -c data/signalboard_full.db > data/signalboard.db.gz.new
          gzip -t data/signalboard.db.gz.new
          mv data/signalboard.db.gz.new data/signalboard.db.gz
          git add data/signalboard.db.gz outputs/signalboard_history_rebuild_latest.json scripts/dashboard/dashboard.html dashboard.html
          git add outputs/first_call_campaign_*.json
          if [ -f outputs/history_repair_campaign.json ]; then git add outputs/history_repair_campaign.json; fi
          git add -f dashboard_deploy_dist
          if ! git diff --cached --quiet; then
            git commit -m "Publish historical extraction repair [skip daily]"
            git push origin HEAD:master
          fi
