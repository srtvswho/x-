name: Babybus sampled review - USD 2 maximum
on:
  push:
    branches: ["research/babybus-sample-20260910"]
    paths: [".github/workflows/babybus-sample.yml"]
permissions:
  contents: write
concurrency:
  group: babybus-sample-20260910
  cancel-in-progress: false
jobs:
  sample:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Sample with server-side cost limits
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, random, time, urllib.request, urllib.parse, datetime, pathlib, re
          OUT = pathlib.Path("outputs/babybus_sample_20260910")
          OUT.mkdir(parents=True, exist_ok=True)
          TOKEN = os.environ["APIFY_TOKEN"]
          API = "https://api.apify.com/v2/"
          RUN_CAP = 0.15
          MAX_RUNS = 8
          assert MAX_RUNS * RUN_CAP <= 1.20
          def api(method, path, data=None, params=None):
              url = API + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, method=method, headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=65) as resp:
                  return json.load(resp)
          def save(name, data):
              (OUT / name).write_text(json.dumps(data, ensure_ascii=False, indent=2))
          rng = random.Random(20260910)
          first = datetime.date(2024, 9, 10)
          last = datetime.date(2026, 9, 10)
          span = (last-first).days
          queries = []
          for i in range(MAX_RUNS):
              lo = first + datetime.timedelta(days=span*i//MAX_RUNS)
              hi = first + datetime.timedelta(days=span*(i+1)//MAX_RUNS)
              start = lo + datetime.timedelta(days=rng.randint(0, max(0, (hi-lo).days-60)))
              end = min(start+datetime.timedelta(days=60), hi)
              queries.append(f"from:BabybusFL since:{start} until:{end} -filter:retweets")
          manifest = {"handle":"BabybusFL", "method":"8 time strata with seeded random 60-day windows; latest up to 125 posts per window; not a uniform random sample of all posts", "seed":20260910, "external_budget_usd":2, "max_reserved_apify_usd":1.2, "additional_model_calls":0, "queries":queries, "runs":[]}
          save("manifest.json", manifest)
          posts = {}
          terminal = {"SUCCEEDED","FAILED","TIMED-OUT","ABORTED"}
          for i, query in enumerate(queries):
              entry = {"query":query, "reserved_usd":RUN_CAP}
              manifest["runs"].append(entry)
              save("manifest.json", manifest)
              try:
                  # Never retry a paid POST: an ambiguous response may already have started a run.
                  run = api("POST","acts/apidojo~twitter-scraper-lite/runs",
                    {"searchTerms":[query],"sort":"Latest","maxItems":125},
                    {"maxTotalChargeUsd":RUN_CAP,"maxItems":125,"timeout":180,"restartOnError":"false","waitForFinish":0})["data"]
                  entry["id"] = run["id"]
                  save("manifest.json", manifest)
                  accepted = run.get("options",{}).get("maxTotalChargeUsd")
                  if accepted is None or float(accepted) > RUN_CAP+1e-9:
                      api("POST",f"actor-runs/{run['id']}/abort")
                      raise RuntimeError("Server did not confirm the requested cost cap")
                  deadline = time.monotonic()+210
                  while run["status"] not in terminal and time.monotonic()<deadline:
                      time.sleep(4)
                      run = api("GET",f"actor-runs/{run['id']}")["data"]
                  if run["status"] not in terminal:
                      api("POST",f"actor-runs/{run['id']}/abort")
                      entry["error"] = "Stopped at local time limit; no further paid requests"
                      break
                  entry.update({"status":run["status"],"usageTotalUsd":run.get("usageTotalUsd"),"chargedEventCounts":run.get("chargedEventCounts"),"pricingInfo":run.get("pricingInfo")})
                  items = api("GET",f"datasets/{run['defaultDatasetId']}/items",params={"clean":"true","limit":150,"format":"json"})
                  entry["returned_items"] = len(items)
                  for item in items:
                      handle = (item.get("author") or {}).get("userName","")
                      if handle.lower() == "babybusfl" and item.get("id"):
                          item["sample_query"] = query
                          posts[str(item["id"])] = item
                  save("posts.json",list(posts.values()))
                  print(json.dumps({"stratum":i,"status":entry["status"],"returned":len(items),"unique_total":len(posts),"run_cost_usd":entry["usageTotalUsd"]}),flush=True)
              except Exception as exc:
                  entry["error_type"] = type(exc).__name__
                  print("Stopped after request error; no automatic retry:",type(exc).__name__,flush=True)
                  break
              finally:
                  manifest["unique_posts"] = len(posts)
                  save("manifest.json",manifest)
          save("posts.json",list(posts.values()))
          # Free public daily price data; no paid finance/model API calls.
          tickers = {"SPY","SOXX","QQQ"}
          for p in posts.values():
              tickers.update(re.findall(r"\$([A-Z]{1,5})\b",p.get("text","")))
          prices = {}
          start_ts = int(datetime.datetime(2024,9,1,tzinfo=datetime.timezone.utc).timestamp())
          end_ts = int(datetime.datetime(2026,9,11,tzinfo=datetime.timezone.utc).timestamp())
          for ticker in sorted(tickers)[:50]:
              try:
                  url = f"https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?period1={start_ts}&period2={end_ts}&interval=1d"
                  req = urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = json.load(r)["chart"]["result"][0]
                  prices[ticker] = data
              except Exception as exc:
                  prices[ticker] = {"error_type":type(exc).__name__}
          save("prices.json",prices)
          print("Saved",len(posts),"posts and",len(prices),"price responses",flush=True)
          
          PY
      - name: Preserve sample and cost evidence on the research branch
        if: always()
        run: |
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
          git add outputs/babybus_sample_20260910/
          git diff --cached --quiet && exit 0
          git commit -m "Save Babybus time-stratified sample and cost ledger [skip ci]"
          git push origin HEAD:research/babybus-sample-20260910
