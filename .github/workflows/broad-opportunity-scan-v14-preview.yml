name: SignalBoard Broad Opportunity Scan v1.4 Preview

on:
  workflow_dispatch:
  push:
    branches: [codex/opportunity-engine-v12-preview]
    paths:
      - ".github/workflows/broad-opportunity-scan-v14-preview.yml"

permissions:
  contents: write

concurrency:
  group: broad-opportunity-scan-v14-preview
  cancel-in-progress: false

jobs:
  broad-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_ENABLED: "true"
      AI_DRY_RUN: "false"
      AI_MAX_COST_PER_RUN_USD: "50.00"
      AI_MAX_DAILY_COST_USD: "75.00"
      AI_MAX_CALLS_PER_RUN: "400"
      ANALYST_MAX_COST_PER_RUN: "50.00"
      GOLDEN_MAX_COST_PER_RUN: "0"
      ALLOW_EXPENSIVE_AI_JOB: "false"
      FORCE_REANALYZE: "false"
      AI_JOB_KIND: "incremental_broad_opportunity_scan"
      AI_WORKFLOW: "broad_opportunity_scan_v14_preview"
      AI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AI_LEDGER_DB_PATH: /workspace/data/signalboard_full.db
      SIGNALBOARD_DB: /workspace/data/signalboard_full.db
      BROAD_DEEP_LIMIT: "15"
      AI_ROUTE_BROAD_CANDIDATE_DISCOVERY_MODEL: "gpt-5.6-terra"
      AI_ROUTE_BROAD_CANDIDATE_DISCOVERY_REASONING_EFFORT: "medium"
      AI_ROUTE_BENEFICIARY_QUICK_ODDS_MODEL: "gpt-5.6-terra"
      AI_ROUTE_BENEFICIARY_QUICK_ODDS_REASONING_EFFORT: "medium"
      AI_ROUTE_BROAD_DEEP_ODDS_MODEL: "gpt-5.6-terra"
      AI_ROUTE_BROAD_DEEP_ODDS_REASONING_EFFORT: "medium"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/opportunity-engine-v12-preview
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify bounded authorization
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$AI_ENABLED" = "true"
          test "$AI_DRY_RUN" = "false"
          test "$ALLOW_EXPENSIVE_AI_JOB" = "false"
          test "$AI_MAX_COST_PER_RUN_USD" = "50.00"
          test "$AI_MAX_DAILY_COST_USD" = "75.00"
          test "$AI_MAX_CALLS_PER_RUN" = "400"
          test -n "${OPENAI_API_KEY:-}"

      - name: Restore isolated Preview database
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check requests pytest
          gzip -t data/signalboard.db.gz
          gzip -cd data/signalboard.db.gz > data/signalboard_full.db
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace
          python - <<'PY'
          import sqlite3
          from signalboard.db import CURRENT_SCHEMA_VERSION, init_db
          path = "/workspace/data/signalboard_full.db"
          init_db(path)
          con = sqlite3.connect(path)
          assert con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          assert con.execute("PRAGMA user_version").fetchone()[0] == CURRENT_SCHEMA_VERSION == 11
          assert con.execute("SELECT COUNT(*) FROM raw_posts").fetchone()[0] == 40141
          assert con.execute("SELECT COUNT(*) FROM claims").fetchone()[0] == 305
          con.close()
          PY

      - name: Run zero-AI dry audit and regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          AI_ENABLED=false python scripts/intel_broad_opportunity_scan_v14.py --plan-only --deep-limit 15
          AI_ENABLED=false python -m pytest -q tests/test_broad_opportunity_scan_v14.py tests/test_opportunity_odds_v13.py tests/test_opportunity_engine_v12.py tests/test_ai_guardrails.py tests/test_research_engine.py

      - name: Execute bounded Broad Opportunity Scan
        run: python scripts/intel_broad_opportunity_scan_v14.py --deep-limit 15

      - name: Enforce spend and integrity fuses
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, sqlite3
          report = json.load(open("outputs/broad_opportunity_scan_v14/run_report.json"))
          con = sqlite3.connect("data/signalboard_full.db")
          run_id = os.environ["AI_RUN_ID"]
          calls, risk = con.execute(
              """SELECT COUNT(*),COALESCE(SUM(COALESCE(actual_cost_if_available,estimated_cost)),0)
                 FROM ai_usage_ledger WHERE run_id=?
                 AND status IN ('PENDING','SUCCESS','FAILED','CANCELLED','UNKNOWN_COST')""", (run_id,)
          ).fetchone()
          golden = con.execute("SELECT COUNT(*) FROM ai_usage_ledger WHERE run_id=? AND stage='golden'", (run_id,)).fetchone()[0]
          assert calls <= 400, calls
          assert risk <= 50.000001, risk
          assert golden == 0, golden
          assert report["coverage"]["candidate_logic_chains"] >= 13
          assert con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          print(json.dumps({"AI_CALLS": calls, "RISK_COST_USD": risk, "STATUS": report["status"], "COVERAGE": report["coverage"]}, ensure_ascii=False))
          con.close()
          PY

      - name: Build Broad Scan Preview Dashboard
        env:
          AI_ENABLED: "false"
          ALLOW_EXPENSIVE_AI_JOB: "false"
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/dashboard/build_dashboard.py
          test -s scripts/dashboard/dashboard.html
          ! grep -q '__BROAD_SCAN__' scripts/dashboard/dashboard.html
          mkdir -p dashboard_deploy_dist/opportunities dashboard_deploy_dist/coverage
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/index.html
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/opportunities/index.html
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/coverage/index.html
          cp scripts/dashboard/dashboard.html dashboard.html

      - name: Save audited Broad Scan artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          gzip -c data/signalboard_full.db > data/signalboard.db.gz.new
          gzip -t data/signalboard.db.gz.new
          mv data/signalboard.db.gz.new data/signalboard.db.gz
          git config user.name signalboard-bot
          git config user.email signalboard-bot@users.noreply.github.com
          git add data/signalboard.db.gz dashboard.html scripts/dashboard/dashboard.html outputs/broad_opportunity_scan_v14
          git add -f dashboard_deploy_dist/index.html dashboard_deploy_dist/opportunities/index.html dashboard_deploy_dist/coverage/index.html
          git commit -m "Generate Broad Opportunity Scan v1.4 Preview [skip daily]"
          git push origin HEAD:codex/opportunity-engine-v12-preview

      - name: Upload Broad Scan audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: broad-opportunity-scan-v14-audit
          path: |
            outputs/broad_opportunity_scan_v14
            scripts/dashboard/dashboard.html
          retention-days: 30
