name: Focused Odds v1.4.1 Paid Preview
# Manual bounded resume after API credit refill (2026-09-01)

on:
  push:
    branches: [codex/focused-odds-v141]
    paths:
      - ".github/workflows/focused-odds-v141-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-odds-v141-preview
  cancel-in-progress: false

jobs:
  # One bounded run; result commits do not match the workflow-only push filter.
  focused-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SIGNALBOARD_DB: /tmp/signalboard_focused_v141.db
      AI_LEDGER_DB_PATH: /tmp/signalboard_focused_v141.db
      AI_ENABLED: "true"
      AI_DRY_RUN: "false"
      ALLOW_EXPENSIVE_AI_JOB: "false"
      AI_JOB_KIND: focused_odds_preview
      AI_WORKFLOW: focused_odds_v141_preview
      AI_RUN_ID: focused-odds-${{ github.run_id }}-${{ github.run_attempt }}
      AI_MAX_COST_PER_RUN_USD: "30"
      AI_MAX_DAILY_COST_USD: "35"
      AI_MAX_CALLS_PER_RUN: "18"
      ANALYST_MAX_COST_PER_RUN: "30"
      MEDIA_MAX_COST_PER_RUN: "0"
      THEME_MAX_COST_PER_RUN: "0"
      CLAIM_MAX_COST_PER_RUN: "0"
      THESIS_MAX_COST_PER_RUN: "0"
      GOLDEN_MAX_COST_PER_RUN: "0"
      FORCE_REANALYZE: "false"
      AI_ROUTE_FOCUSED_FINANCIAL_SNAPSHOT_PROVIDER: openai
      AI_ROUTE_FOCUSED_FINANCIAL_SNAPSHOT_MODEL: gpt-5.6-terra
      AI_ROUTE_FOCUSED_FINANCIAL_SNAPSHOT_REASONING_EFFORT: high
      AI_ROUTE_FOCUSED_ODDS_ANALYSIS_PROVIDER: openai
      AI_ROUTE_FOCUSED_ODDS_ANALYSIS_MODEL: gpt-5.6-terra
      AI_ROUTE_FOCUSED_ODDS_ANALYSIS_REASONING_EFFORT: high

    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/focused-odds-v141
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bounded runtime
        run: python -m pip install --disable-pip-version-check requests pytest

      - name: Verify paid credential and restore Preview database
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$OPENAI_API_KEY"
          gzip -dc data/signalboard.db.gz > "$SIGNALBOARD_DB"
          python -c "from signalboard.db import init_db; init_db('$SIGNALBOARD_DB')"

      - name: Zero-AI plan and focused tests
        shell: bash
        env:
          AI_ENABLED: "false"
        run: |
          set -Eeuo pipefail
          python scripts/intel_focused_odds_v141.py --plan-only
          python -m pytest -q tests/test_focused_odds_v141.py tests/test_broad_opportunity_scan_v14.py tests/test_opportunity_odds_v13.py tests/test_opportunity_engine_v12.py

      - name: Run bounded six-security Terra Preview
        run: python scripts/intel_focused_odds_v141.py --allow-partial

      - name: Enforce completion and hard cost limits
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          report=json.load(open('outputs/focused_odds_v141/run_report.json'))
          assert report['cost']['attempted_calls'] <= 18
          assert report['cost']['risk_cost_usd'] <= 30
          assert report['production_changed'] is False
          assert report['stop_state']=='FOCUSED ODDS REVIEW READY'
          print('completion',report['completed_count'],'/ 6',report['status'],report.get('errors'))
          PY

      - name: Build Draft Preview with AI disabled
        shell: bash
        env:
          AI_ENABLED: "false"
          OPENAI_API_KEY: ""
          POLYGON_API_KEY: ""
        run: |
          set -Eeuo pipefail
          python scripts/dashboard/build_dashboard.py
          mkdir -p dashboard_deploy_dist/focused-odds
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/index.html
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/focused-odds/index.html
          gzip -c "$SIGNALBOARD_DB" > data/signalboard.db.gz

      - name: Upload paid audit artifact before branch write
        uses: actions/upload-artifact@v7
        with:
          name: focused-odds-v141-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            outputs/focused_odds_v141/
            data/signalboard.db.gz
            dashboard_deploy_dist/focused-odds/index.html

      - name: Commit Draft Preview results
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signalboard/db.py outputs/focused_odds_v141 data/signalboard.db.gz
          git add -f dashboard_deploy_dist/index.html dashboard_deploy_dist/focused-odds/index.html
          git commit -m "Add six-security Focused Odds paid Preview [skip daily]" || exit 0
          git push origin HEAD:codex/focused-odds-v141
