name: Babybus free price validation and final cost receipt
on:
  push:
    branches: ["research/babybus-sample-20260910"]
    paths: [".github/workflows/babybus-price-validation.yml"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Free market data and read-only cost receipt
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,datetime,urllib.request,urllib.parse,pathlib,concurrent.futures
          out=pathlib.Path("outputs/babybus_sample_20260910")
          out.mkdir(parents=True,exist_ok=True)
          tickers=["NVDA","INTC","MU","CRWV","NBIS","SOXX","SPY","GOOGL","LITE","NFLX","000660.KS","^KS11","ORCL","SNDK","GLD","SLV","BTC-USD","META","GDXU","AAOI","AVGO","CBRS","RKLB"]
          ids=["dXyfzMTu6MsesQlqf","WA3qFzRie65tx4ttg","hnJExmBzCfdiuyCru","QryWlXPGUcPPYeBjq","36eMc91oZ0tNy88VU","b3kXVH7cG82Mzc0W6","bRssKf3ZtGnQvwTos","fixrAR96hbHzchExL","sspgN0hMEdg3aVIdu","Ibjh7Pv5DRxsOjqHb","ghVBCUTxgepjJ7R0n","bedTrveahZukqzrBC"]
          p1=int(datetime.datetime(2026,6,1,tzinfo=datetime.timezone.utc).timestamp())
          p2=int(datetime.datetime(2026,9,10,tzinfo=datetime.timezone.utc).timestamp())
          def fetch(t):
              url=f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(t)}?period1={p1}&period2={p2}&interval=1d"
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=15) as r:d=json.load(r)["chart"]["result"][0]
                  q=d["indicators"]["quote"][0]
                  return t,{"symbol":d["meta"]["symbol"],"timezone":d["meta"]["exchangeTimezoneName"],"timestamp":d["timestamp"],"quote":q,"adjclose":d["indicators"].get("adjclose"),"events":d.get("events")}
              except Exception as e:return t,{"error":type(e).__name__}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              prices=dict(ex.map(fetch,tickers))
          (out/"audit_prices.json").write_text(json.dumps(prices,ensure_ascii=False))
          ledger=[]
          for rid in ids:
              req=urllib.request.Request("https://api.apify.com/v2/actor-runs/"+rid,headers={"Authorization":"Bearer "+os.environ["APIFY_TOKEN"]})
              with urllib.request.urlopen(req,timeout=20) as r:d=json.load(r)["data"]
              ledger.append({"id":rid,"status":d["status"],"cost_usd":d.get("usageTotalUsd"),"events":d.get("chargedEventCounts"),"cap":d.get("options",{}).get("maxTotalChargeUsd")})
          (out/"final_costs.json").write_text(json.dumps({"runs":ledger,"apify_total_usd":sum(x["cost_usd"] or 0 for x in ledger),"paid_model_calls":0},indent=2))
          print(json.dumps({"prices":{k:len(v.get("timestamp",[])) for k,v in prices.items()},"apify_usd":sum(x["cost_usd"] or 0 for x in ledger)}))
          
          PY
      - name: Save validation inputs
        run: |
          git config user.name "signalboard-bot"
          git config user.email "signalboard-bot@users.noreply.github.com"
          git add outputs/babybus_sample_20260910/audit_prices.json outputs/babybus_sample_20260910/final_costs.json
          git commit -m "Save free market data and settled Babybus API charges [skip ci]"
          git push origin HEAD:research/babybus-sample-20260910
