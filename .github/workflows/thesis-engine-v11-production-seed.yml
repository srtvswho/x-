name: Thesis Engine v1.1 Production Seed

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signalboard-data-write
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_ENABLED: "false"
      AI_DRY_RUN: "false"
      ALLOW_EXPENSIVE_AI_JOB: "false"
      FORCE_REANALYZE: "false"
      SEED_EXISTING_RESULTS_ONLY: "true"
      AI_JOB_KIND: archived_golden_seed
      AI_WORKFLOW: golden_productionization_zero_ai
      AI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AI_LEDGER_DB_PATH: /workspace/data/signalboard_full.db
      AI_MAX_COST_PER_RUN_USD: "0"
      AI_MAX_DAILY_COST_USD: "0"
      AI_MAX_CALLS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Restore production database
        run: |
          set -Eeuo pipefail
          gzip -t data/signalboard.db.gz
          gzip -cd data/signalboard.db.gz > data/signalboard_full.db
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace
      - name: Seed archived Golden results twice without AI
        run: |
          set -Eeuo pipefail
          python scripts/intel_seed_existing_golden.py --db data/signalboard_full.db \
            --output outputs/thesis_engine_v11/production_seed_run_1.json
          python scripts/intel_golden_revalidate_existing.py --db data/signalboard_full.db
          python scripts/intel_seed_existing_golden.py --db data/signalboard_full.db \
            --output outputs/thesis_engine_v11/production_seed_run_2.json
          python - <<'PY'
          import json, sqlite3
          report=json.load(open('outputs/thesis_engine_v11/production_seed_run_2.json'))
          if any(report['delta'].values()):
              raise SystemExit(f"Second seed was not idempotent: {report['delta']}")
          con=sqlite3.connect('data/signalboard_full.db')
          statuses=dict(con.execute('SELECT case_id,status FROM golden_validations'))
          if statuses != {
              'case_a_ymtc_nand_china_wfe':'PASS',
              'case_b_abf_copos_cowop_pcb':'PASS',
          }:
              raise SystemExit(f"Golden statuses incorrect: {statuses}")
          calls=con.execute("SELECT COUNT(*) FROM ai_usage_ledger WHERE run_id=? AND provider='openai' AND status IN ('PENDING','SUCCESS','FAILED','CANCELLED','UNKNOWN_COST')", ('${{ github.run_id }}-${{ github.run_attempt }}',)).fetchone()[0]
          if calls:
              raise SystemExit(f"Zero-AI invariant violated: {calls} OpenAI attempts")
          print('OPENAI_CALLS=0 OPENAI_COST_USD=0.00 IDEMPOTENT=true')
          PY
      - name: Build production Thesis Change Feed
        run: |
          python scripts/dashboard/build_dashboard.py
          test -s scripts/dashboard/dashboard.html
          test "$(stat -c%s scripts/dashboard/dashboard.html)" -ge 10000
          mkdir -p dashboard_deploy_dist/legacy dashboard_deploy_dist/research-clues
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/legacy/index.html
          python scripts/dashboard/build_research_clue_preview.py \
            --output dashboard_deploy_dist/research-clues/index.html
          cp dashboard_deploy_dist/research-clues/index.html dashboard_deploy_dist/index.html
          cp dashboard_deploy_dist/research-clues/index.html dashboard.html
      - name: Persist audited production seed
        run: |
          set -Eeuo pipefail
          gzip -c data/signalboard_full.db > data/signalboard.db.gz.new
          gzip -t data/signalboard.db.gz.new
          mv data/signalboard.db.gz.new data/signalboard.db.gz
          git config user.name signalboard-bot
          git config user.email signalboard-bot@users.noreply.github.com
          git add data/signalboard.db.gz scripts/dashboard/dashboard.html dashboard.html
          git add -f dashboard_deploy_dist/index.html dashboard_deploy_dist/research-clues/index.html dashboard_deploy_dist/legacy/index.html outputs/thesis_engine_v11/golden_validation_report.* outputs/thesis_engine_v11/production_seed_run_*.json
          git commit -m "Productionize archived Golden cases with zero AI [skip daily]"
          git push origin HEAD:master
      - name: Upload final production audit
        uses: actions/upload-artifact@v6
        with:
          name: thesis-engine-v11-production-audit-zero-ai
          path: |
            outputs/thesis_engine_v11/golden_validation_report.*
            outputs/thesis_engine_v11/production_seed_run_*.json
          if-no-files-found: error
