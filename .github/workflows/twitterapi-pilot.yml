name: TwitterAPI.io isolated pilot
on:
  workflow_dispatch:
    inputs:
      free_credit_verified:
        description: 'Verified free balance >= 1000 credits and auto-recharge disabled; no payment'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: twitterapi-isolated-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: inputs.free_credit_verified
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Offline contract tests (no credentials)
        run: python -m unittest discover -s tests -p test_twitterapi_io.py
      - name: Two-account pilot (no retries, DB writes, model calls or deployment)
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          TWITTERAPI_FREE_CREDIT_VERIFIED: 'true'
        run: python scripts/twitterapi_pilot.py
