name: Normalize Opportunity Scores (Zero AI)
# One-time deterministic preview repair; no model provider is configured.

on:
  push:
    branches:
      - codex/opportunity-engine-v12-preview
    paths:
      - .github/workflows/opportunity-score-normalization-zero-ai.yml

permissions:
  contents: write

concurrency:
  group: opportunity-score-normalization-zero-ai
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_ENABLED: "false"
      AI_DRY_RUN: "false"
      ALLOW_EXPENSIVE_AI_JOB: "false"
      AI_MAX_COST_PER_RUN_USD: "0"
      AI_MAX_DAILY_COST_USD: "0"
      AI_MAX_CALLS_PER_RUN: "0"
      AI_RUN_ID: score-normalize-${{ github.run_id }}
      AI_LEDGER_DB_PATH: /workspace/data/signalboard_full.db
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/opportunity-engine-v12-preview
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore isolated preview database
        run: |
          set -Eeuo pipefail
          gzip -t data/signalboard.db.gz
          gzip -cd data/signalboard.db.gz > data/signalboard_full.db
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace
      - name: Normalize score scale without AI
        run: |
          set -Eeuo pipefail
          python scripts/intel_normalize_opportunity_scores.py
          python - <<'PY'
          import os, sqlite3
          con=sqlite3.connect('data/signalboard_full.db')
          calls=con.execute(
              "SELECT COUNT(*) FROM ai_usage_ledger WHERE run_id=? AND status IN ('PENDING','SUCCESS','FAILED','CANCELLED','UNKNOWN_COST')",
              (os.environ['AI_RUN_ID'],),
          ).fetchone()[0]
          assert calls == 0, f"zero-AI normalization attempted {calls} calls"
          print('OPENAI_CALLS=0 OPENAI_COST_USD=0')
          PY
      - name: Rebuild Preview Dashboard
        env:
          SIGNALBOARD_DB: /workspace/data/signalboard_full.db
        run: |
          set -Eeuo pipefail
          python scripts/dashboard/build_dashboard.py
          mkdir -p dashboard_deploy_dist/opportunities
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/index.html
          cp scripts/dashboard/dashboard.html dashboard_deploy_dist/opportunities/index.html
          cp scripts/dashboard/dashboard.html dashboard.html
      - name: Save normalized preview
        run: |
          set -Eeuo pipefail
          gzip -c data/signalboard_full.db > data/signalboard.db.gz.new
          gzip -t data/signalboard.db.gz.new
          mv data/signalboard.db.gz.new data/signalboard.db.gz
          git config user.name signalboard-bot
          git config user.email signalboard-bot@users.noreply.github.com
          git add data/signalboard.db.gz scripts/dashboard/dashboard.html dashboard.html
          git add -f dashboard_deploy_dist/index.html dashboard_deploy_dist/opportunities/index.html
          git add outputs/opportunity_engine_v12
          git commit -m "Normalize Opportunity scores to 0-100 [zero AI] [skip daily]"
          git push origin HEAD:codex/opportunity-engine-v12-preview
      - uses: actions/upload-artifact@v6
        with:
          name: opportunity-score-normalization-zero-ai
          path: outputs/opportunity_engine_v12/score_normalization_report.json
          if-no-files-found: error
