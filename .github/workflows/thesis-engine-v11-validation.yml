name: Thesis Engine v1.1 Golden Validation

on:
  workflow_dispatch:
    inputs:
      ai_enabled:
        description: "Explicitly enable paid AI"
        required: true
        type: boolean
        default: false
      allow_expensive_ai_job:
        description: "Acknowledge that full Golden is an expensive AI job"
        required: true
        type: boolean
        default: false
      ai_dry_run:
        description: "Estimate Golden calls without sending paid AI requests"
        required: true
        type: boolean
        default: true
  pull_request:
    branches: [master]
    paths:
      - "signalboard/**"
      - "scripts/intel_*.py"
      - "scripts/dashboard/**"
      - "tests/golden_cases.json"
      - "tests/**"
      - ".github/workflows/thesis-engine-v11-validation.yml"

permissions:
  contents: read

concurrency:
  group: thesis-v11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests pytest pyyaml
      - name: Unit tests
        env:
          AI_ENABLED: "false"
        run: python -m pytest -q tests/test_research_engine.py tests/test_ai_guardrails.py tests/test_golden_productionization.py
      - name: Static validation
        run: |
          python -m py_compile scripts/intel_*.py signalboard/ai/*.py signalboard/db.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY

  golden:
    if: github.event_name == 'workflow_dispatch' && inputs.ai_enabled && inputs.allow_expensive_ai_job
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ inputs.ai_enabled && secrets.OPENAI_API_KEY || '' }}
      AI_ENABLED: ${{ inputs.ai_enabled }}
      ALLOW_EXPENSIVE_AI_JOB: ${{ inputs.allow_expensive_ai_job }}
      AI_JOB_KIND: golden_full
      AI_WORKFLOW: thesis_engine_full_golden
      AI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AI_LEDGER_DB_PATH: /workspace/data/signalboard_full.db
      AI_MAX_COST_PER_RUN_USD: "0.50"
      AI_MAX_DAILY_COST_USD: "1.00"
      AI_MAX_CALLS_PER_RUN: "20"
      EXTRACT_MAX_COST_PER_RUN: "0.05"
      MEDIA_MAX_COST_PER_RUN: "0.05"
      THEME_MAX_COST_PER_RUN: "0.05"
      CLAIM_MAX_COST_PER_RUN: "0.10"
      THESIS_MAX_COST_PER_RUN: "0.10"
      ANALYST_MAX_COST_PER_RUN: "0.10"
      GOLDEN_MAX_COST_PER_RUN: "0.05"
      AI_DRY_RUN: ${{ inputs.ai_dry_run }}
      FORCE_REANALYZE: "false"
      AI_ROUTE_BULK_POST_PROCESSING_PROVIDER: deepseek
      AI_ROUTE_BULK_POST_PROCESSING_MODEL: deepseek-v4-flash
      AI_ROUTE_MEDIA_UNDERSTANDING_MODEL: gpt-5.6-terra
      AI_ROUTE_THEME_CANONICALIZATION_MODEL: gpt-5.6-terra
      AI_ROUTE_CLAIM_VERIFICATION_MODEL: gpt-5.6-terra
      AI_ROUTE_THESIS_UPDATE_MODEL: gpt-5.6-terra
      AI_ROUTE_AI_ANALYST_MODEL: gpt-5.6-terra
      AI_ROUTE_CROSS_AUTHOR_ANALYSIS_MODEL: gpt-5.6-terra
      AI_ROUTE_RESEARCH_CASE_SYNTHESIS_MODEL: gpt-5.6-terra
      GOLDEN_IDS: 2090779070523162841,2092457458341937311,2092457470765531481,2092474407679922609,2092482318665650559,2092492304976351332,2092503684810998119,2092550362691760189,1997151412309078335,2092785771979960560,2092786981977915481,2025470786073755771,2087139633109115036,2070266870557704335,2066651558784463190,2074774120324276615
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_research_engine.py tests/test_ai_guardrails.py tests/test_golden_productionization.py
      - name: Restore production snapshot
        run: |
          gzip -t data/signalboard.db.gz
          gzip -cd data/signalboard.db.gz > data/signalboard_full.db
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace
      - name: Verify AI credentials exist
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$DEEPSEEK_API_KEY"
      - name: Replay recursive Golden evidence graph
        run: python scripts/intel_graph_ingest.py --db data/signalboard_full.db --post-ids "$GOLDEN_IDS" --refresh --include-context
      - name: Extract Golden Claims and Themes
        run: python scripts/intel_extract.py --db data/signalboard_full.db --post-ids "$GOLDEN_IDS" --include-context --include-graph-context --claims-missing --max-targets 30
      - name: Analyze required Golden media
        run: python scripts/intel_media_analyze.py --db data/signalboard_full.db --post-ids "$GOLDEN_IDS" --limit 6
      - name: Deduplicate underlying sources
        run: python scripts/intel_source_dedup.py --db data/signalboard_full.db --post-ids "$GOLDEN_IDS" --resolve-redirects
      - name: Audit and canonicalize Themes
        run: python scripts/intel_theme_canonicalize.py --db data/signalboard_full.db --apply --max-pairs 240
      - name: Verify high-importance Golden Claims
        run: python scripts/intel_claim_verify.py --db data/signalboard_full.db --post-ids "$GOLDEN_IDS" --limit 40
      - name: Incrementally update Author by Theme theses
        run: python scripts/intel_thesis_update.py --db data/signalboard_full.db --post-ids "$GOLDEN_IDS" --limit 30
      - name: Run independent Terra analyst
        run: python scripts/intel_ai_analyst.py --db data/signalboard_full.db --post-ids "$GOLDEN_IDS" --limit 30
      - name: Synthesize cross-theme Golden research cases
        run: python scripts/intel_case_synthesis.py --db data/signalboard_full.db
      - name: Evaluate deterministic Golden acceptance gates
        run: python scripts/intel_golden_tests.py --db data/signalboard_full.db
      - name: Build full evidence and cost audit
        run: python scripts/intel_v11_report.py --db data/signalboard_full.db
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v6
        with:
          name: thesis-engine-v11-audit
          path: outputs/thesis_engine_v11/*.json
          if-no-files-found: error
