<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGNAL DESK · 大V情报终端</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--panel-2:#f8fafc;--line:#e2e6ec;--line-soft:#edf0f4;
  --ink:#172033;--ink-dim:#526075;--ink-faint:#8993a3;
  --amber:#a86708;--amber-soft:#fff5df;--cyan:#126f78;--cyan-soft:#e8f5f5;
  --rose:#b94258;--rose-soft:#fcecef;--violet:#6557c8;--blue:#315efb;--blue-soft:#eef2ff;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
::selection{background:#ffd58c;color:#172033}

.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;
  padding:0 max(24px,calc((100vw - 1120px)/2));height:62px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(226,230,236,.9);box-shadow:0 1px 8px rgba(23,32,51,.035)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .mark{font-family:var(--mono);font-weight:750;letter-spacing:.12em;font-size:15px;color:var(--ink)}
.brand .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--ink-faint);text-transform:uppercase}
.topbar .spacer{flex:1}
.clock{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.06em}
.clock b{color:var(--blue)}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase}
.live .dot{width:7px;height:7px;border-radius:50%;background:#25a36f;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(72,201,214,.5)}70%{box-shadow:0 0 0 7px rgba(72,201,214,0)}100%{box-shadow:0 0 0 0 rgba(72,201,214,0)}}

.wrap{max-width:1120px;margin:0 auto;padding:20px 24px 88px}

.shead{display:flex;align-items:center;gap:12px;margin:36px 0 14px}
.shead:first-child{margin-top:18px}
.shead .num{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:var(--blue-soft);font-family:var(--mono);font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.04em}
.shead h2{margin:0;font-size:19px;font-weight:720;letter-spacing:-.02em}
.shead .hint{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.04em}
.shead .rule{flex:1;height:1px;background:var(--line-soft)}

/* ===== 最近动态 时间 badge + 静默日 banner ===== */
.rel{display:inline-block;margin-top:3px;padding:1px 5px;border-radius:3px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;line-height:1.4;font-weight:600;}
.rt-today{background:rgba(72,201,214,.18);color:var(--cyan);border:1px solid rgba(72,201,214,.35);}
.rt-1d{background:rgba(72,201,214,.14);color:var(--cyan);border:1px solid rgba(72,201,214,.25);}
.rt-recent{background:rgba(240,167,60,.12);color:var(--amber);border:1px solid rgba(240,167,60,.25);}
.rt-mid{background:rgba(154,140,255,.10);color:var(--violet);border:1px solid rgba(154,140,255,.20);}
.rt-old{background:rgba(154,164,184,.08);color:var(--ink-faint);border:1px solid rgba(154,164,184,.15);}
.banner-silent{margin:0 0 14px;padding:10px 14px;background:rgba(240,167,60,.08);
  border:1px solid rgba(240,167,60,.25);border-radius:6px;
  color:var(--amber);font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;}

/* ===== today brief (hero) ===== */
.brief{background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(23,32,51,.055);
  border-radius:16px;padding:24px 26px;position:relative;overflow:hidden;margin-top:8px}
.brief::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--blue),#6c8cff 55%,#aab9ff)}
.brief .bh{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.brief .blabel{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.brief .bdate{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-left:auto}
.brief .btext{font-size:15px;line-height:1.65;color:var(--ink)}
.brief .btext .mark-amber{color:var(--amber)}
.brief .bstrip{display:flex;flex-wrap:wrap;gap:14px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line-soft)}
.brief .bstat{display:flex;align-items:baseline;gap:6px}
.brief .bstat .v{font-family:var(--mono);font-weight:700;font-size:15px}
.brief .bstat .v.cy{color:var(--cyan)}.brief .bstat .v.am{color:var(--amber)}
.brief .bstat .k{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.brief .bdate-sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-left:8px}
.brief .bwin{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-bottom:16px;padding:8px 10px;background:var(--panel-2);border-radius:8px}
.feed-empty .win-range{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:4px;display:block}
.stmt .tag.ordinary{background:rgba(255,255,255,.05);color:var(--ink-faint);border:1px dashed rgba(255,255,255,.18)}
.brief .bempty{padding:8px 12px;margin:0 0 12px;border-radius:6px;font-size:12.5px;line-height:1.4}
.brief .bempty.warn{background:rgba(224,97,122,.12);border:1px solid rgba(224,97,122,.4);color:var(--pink)}
.brief .bempty.info{background:rgba(72,201,214,.10);border:1px solid rgba(72,201,214,.32);color:var(--cyan)}
.feed-empty{padding:8px 12px;margin:0 0 12px;border-radius:6px;font-size:12.5px;color:var(--ink-faint)}
.feed-empty.warn{background:rgba(224,97,122,.12);border:1px solid rgba(224,97,122,.4);color:var(--pink)}
.brief .bhot{margin-left:auto;display:flex;gap:6px;align-items:center}

/* ===== window toggle ===== */
.winrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.winrow .lab{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{font-family:var(--mono);font-size:11px;color:var(--ink-dim);background:none;border:none;
  padding:5px 12px;border-radius:5px;cursor:pointer;letter-spacing:.04em;transition:.15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--amber);color:#fff;font-weight:600}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.filters label{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}
.filters select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;
  padding:8px 30px 8px 11px;font-family:var(--sans);font-size:12px;box-shadow:0 1px 2px rgba(23,32,51,.03)}
.period-control{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.period-control label{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}
.period-control select{min-width:146px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 32px 9px 12px;font-family:var(--sans);font-size:12px;box-shadow:0 1px 2px rgba(23,32,51,.03)}
.structured-summary{display:grid;gap:0;border:1px solid var(--line-soft);border-radius:11px;overflow:hidden}
.summary-line{display:grid;grid-template-columns:105px 1fr;gap:16px;align-items:start;padding:11px 14px;background:#fff;border-bottom:1px solid var(--line-soft)}
.summary-line:last-child{border-bottom:none}.summary-line:nth-child(even){background:#fbfcfe}
.summary-key{font-size:12px;color:var(--blue);font-weight:700;padding-top:1px}
.summary-value{color:var(--ink);line-height:1.55}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px}
.pager button{background:var(--panel);color:var(--ink-dim);border:1px solid var(--line);border-radius:6px;
  padding:6px 12px;cursor:pointer}.pager button:disabled{opacity:.35;cursor:default}
.pager span{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.perfgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 14px}
.perfstat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.perfstat .v{font-family:var(--mono);font-size:17px;font-weight:700}.perfstat .k{font-size:10px;color:var(--ink-faint);display:block}
.pos{color:var(--cyan)}.neg{color:var(--rose)}

/* consensus band */
.consensus{background:linear-gradient(135deg,#f6f8ff,#fff);border:1px solid #dce3ff;border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 5px 18px rgba(49,94,251,.045)}
.consensus .ch{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.consensus .clabel{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.consensus .cwin{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:auto}
.consensus .ctext{font-size:13px;line-height:1.66;color:var(--ink-dim)}

/* ===== stance grid ===== */
.stance-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.stance{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 5px 18px rgba(23,32,51,.035)}
.stance .sh{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.stance .sh .av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--mono);font-weight:700;font-size:12px;color:#fff}
.stance .sh .nm{font-weight:600;font-size:13.5px}
.stance .sh .tp{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim)}
.stance .sh .tp.signal{color:var(--cyan);border-color:var(--cyan-soft);background:var(--cyan-soft)}
.stance .ct{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.stance .psum{font-size:12.5px;line-height:1.6;color:var(--ink-dim);padding:12px;margin-bottom:12px;
  background:var(--panel-2);border-radius:10px;border:1px solid var(--line-soft)}
.stance .psum .lead{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);display:block;margin-bottom:4px}
.stmt{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.stmt:last-child{border-bottom:none;padding-bottom:0}
.stmt .dir{flex:none;width:16px;text-align:center;font-family:var(--mono);font-weight:700;font-size:12px;margin-top:1px}
.stmt .dir.long{color:var(--cyan)}.stmt .dir.short{color:var(--rose)}.stmt .dir.neutral{color:var(--ink-faint)}
.stmt .body{flex:1;min-width:0}
.stmt .txt{font-size:12px;color:var(--ink);line-height:1.5}
.stmt .meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:5px}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;padding:2px 6px;border-radius:4px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim)}
.tag.bk{color:var(--amber);border-color:var(--amber-soft);background:var(--amber-soft)}
.tag.strong{color:var(--cyan);border-color:var(--cyan-soft);background:var(--cyan-soft)}
.tag.weak{color:var(--rose);border-color:var(--rose-soft);background:var(--rose-soft)}
.tag.date{color:var(--ink-faint)}
.flag{font-family:var(--mono);font-size:9px;letter-spacing:.05em;padding:2px 6px;border-radius:4px;
  background:#f0edff;border:1px solid #ddd7ff;color:var(--violet)}

/* ===== daily feed ===== */
.feed{display:flex;flex-direction:column}
.fitem{display:grid;grid-template-columns:58px 28px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line-soft)}
.fitem:last-child{border-bottom:none}
.fitem .ftime{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-align:right;padding-top:2px;line-height:1.4}
.fitem .frail{display:flex;flex-direction:column;align-items:center}
.fitem .fav{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--mono);font-weight:700;font-size:11px;color:#fff}
.fitem .fline{flex:1;width:1px;background:var(--line-soft);margin-top:6px;min-height:8px}
.fitem:last-child .fline{display:none}
.fbody{min-width:0}
.fbody .ftop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:5px}
.fbody .fnm{font-weight:600;font-size:12.5px}
.fbody .fsum{font-size:13px;color:var(--ink-dim);line-height:1.62}
.fbody .frebut{margin-top:6px;font-size:11.5px;color:var(--amber);line-height:1.45;padding-left:9px;border-left:2px solid var(--amber-soft)}
.fbody .frow{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.dirpill{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.dirpill.long{background:var(--cyan-soft);color:var(--cyan)}.dirpill.short{background:var(--rose-soft);color:var(--rose)}
.atb{font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:1.5px 6px;border-radius:3px;border:1px solid var(--line);color:var(--ink-faint)}
.atb.ORIGINAL{color:var(--cyan);border-color:var(--cyan-soft)}
.flink{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:auto}
.flink:hover{color:var(--cyan)}
.feed-toggle{margin-top:14px;text-align:center}
.feed-toggle button{font-family:var(--mono);font-size:11px;color:var(--ink-dim);background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:8px 18px;cursor:pointer;letter-spacing:.04em}
.feed-toggle button:hover{color:var(--ink);border-color:#34405a}

/* ===== ticker table ===== */
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:0 5px 18px rgba(23,32,51,.035)}
.ttable{width:100%;border-collapse:collapse;font-size:12.5px}
.ttable thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);text-align:left;padding:11px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
.ttable tbody td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.ttable tbody tr:last-child td{border-bottom:none}
.ttable tbody tr:hover{background:var(--panel-2)}
.tk{font-family:var(--mono);font-weight:700;font-size:13px}.tk.long{color:var(--cyan)}.tk.short{color:var(--rose)}
.by{display:flex;align-items:center;gap:7px}
.by .av{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:10px;color:#0c0e13;flex:none}
.by .nm{font-size:12px}
.when{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.circle{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px}
.circle.in{color:var(--cyan)}.circle.out{color:var(--ink-faint)}
.dirpill2{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.dirpill2.long{background:var(--cyan-soft);color:var(--cyan)}.dirpill2.short{background:var(--rose-soft);color:var(--rose)}
.pending{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-faint);border:1px dashed var(--line);border-radius:5px;padding:4px 9px;display:inline-flex;align-items:center;gap:6px}
.pending .q{color:var(--amber)}

/* ===== KOL cards (now at bottom, compact reference) ===== */
.kolgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kol{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(23,32,51,.03)}
.kol::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--amber))}
.kol .khead{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.kol .avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;color:#fff;background:var(--accent,var(--amber))}
.kol .kname{font-weight:600;font-size:14px}
.kol .khandle{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.kol .ktype{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim)}
.kol[data-type="signal"] .ktype{color:var(--cyan);border-color:var(--cyan-soft);background:var(--cyan-soft)}
.kol .kdesc{margin:10px 0 11px;font-size:11.5px;color:var(--ink-dim);line-height:1.45}
.kgroup{margin-top:8px}
.kgroup .glab{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:5px;margin-bottom:5px}
.kgroup.strong .glab{color:var(--cyan)}.kgroup.weak .glab{color:var(--rose)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:5px;line-height:1.3;border:1px solid transparent}
.chip.s{background:var(--cyan-soft);color:var(--cyan);border-color:#cce7e9}
.chip.w{background:var(--rose-soft);color:var(--rose);border-color:#f2cfd6}

.foot{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.foot .sep{color:var(--line)}

@media(max-width:1080px){.kolgrid{grid-template-columns:repeat(2,1fr)}.stance-grid{grid-template-columns:1fr}}
@media(max-width:680px){
  .topbar{padding:0 14px;height:58px}.brand .sub,.clock{display:none}
  .kolgrid{grid-template-columns:1fr}.wrap{padding:12px 14px 60px}.shead{margin-top:30px}.shead:first-child{margin-top:14px}.shead .hint,.shead .rule{display:none}
  .brief{padding:20px 16px}.brief .bh{flex-wrap:wrap}.brief .bdate{margin-left:0}.brief .bhot{width:100%;margin-left:0;margin-top:6px}
  .summary-line{grid-template-columns:1fr;gap:4px;padding:10px 11px}.summary-key{font-size:11px}.summary-value{font-size:13px}
  .ttable thead{display:none}.ttable,.ttable tbody,.ttable tr,.ttable td{display:block;width:100%}
  .ttable tbody tr{border-bottom:1px solid var(--line);padding:6px 0}.ttable td{border:none;padding:5px 14px}
  .fitem{grid-template-columns:42px 22px 1fr;gap:10px}
  .perfgrid{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">SIGNAL DESK</span><span class="sub">semiconductor intel</span></div>
  <div class="spacer"></div>
  <span class="clock" id="clock"></span>
  <span class="live" id="live-meta"><span class="dot"></span><span id="live-text">loading...</span></span>
</div>

<div class="wrap">

  <!-- ===== 今日总结 (hero) ===== -->
  <div class="shead"><span class="num">01</span><h2>今日总结</h2>
    <span class="hint">四源综合 · LLM 提炼 · 已按能力圈加权</span><span class="rule"></span></div>
  <div class="period-control"><label for="summary-date">时间范围</label><select id="summary-date"></select></div>
  <div class="brief" id="brief"></div>

  <!-- ===== 近期态度 ===== -->
  <div class="shead"><span class="num">02</span><h2>近期态度</h2>
    <span class="hint">单人/共识总结 + 强项方向表态 · 随时间窗变化</span><span class="rule"></span></div>
  <div class="period-control"><label for="stance-window">时间范围</label><select id="stance-window">

<script id="DATA" type="application/json">__RECORDS__</script>
<script id="KOLS" type="application/json">__KOLS__</script>
<script id="TICKERS" type="application/json">__TICKERS__</script>
<script id="CALL_PERFORMANCE" type="application/json">__CALL_PERFORMANCE__</script>
<script id="SUMMARIES" type="application/json">__SUMMARIES__</script>
<script id="TODAY_STATS" type="application/json">__TODAY_STATS__</script>
<script id="TODAY_RECORDS" type="application/json">__TODAY_RECORDS__</script>
<script id="BUILD_META" type="application/json">__BUILD_META__</script>
<script>
const RECORDS=JSON.parse(document.getElementById('DATA').textContent);
const KOLS=JSON.parse(document.getElementById('KOLS').textContent);
const TICKERS=JSON.parse(document.getElementById('TICKERS').textContent);
const CALL_PERFORMANCE=JSON.parse(document.getElementById('CALL_PERFORMANCE').textContent);
const SUM=JSON.parse(document.getElementById('SUMMARIES').textContent);
const TODAY_STATS=JSON.parse(document.getElementById('TODAY_STATS').textContent);
const TODAY_RECORDS=JSON.parse(document.getElementById('TODAY_RECORDS').textContent);
const BUILD_META=JSON.parse(document.getElementById('BUILD_META').textContent);
// 单一今日窗口函数 (24h 滚动) — 跟 build_dashboard.py / intel_gen_summaries.py / query_today_stats 共用
function todayWindowUTC(){return [new Date(BUILD_META.window_start_utc), new Date(BUILD_META.window_end_utc)];}
const COLORS={jukan:'#48c9d6',serenity:'#f0a73c',zephyr:'#9a8cff',austin:'#e0617a'};
const ORDER=['jukan','serenity','zephyr','austin'];
function initials(n){return n.slice(0,1).toUpperCase()}
// 北京时间格式化 (统一时区, 不依赖浏览器本地时区)
const CST_FMT = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
const CST_FMT_DATE = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' });
function _cstParts(iso, withTime){
  const d = new Date(iso);
  const parts = (withTime ? CST_FMT : CST_FMT_DATE).formatToParts(d);
  const m = {};
  for (const p of parts) m[p.type] = p.value;
  return m;
}
function fmtDate(iso){const m=_cstParts(iso,false);return `${parseInt(m.month)}/${parseInt(m.day)}`}
function fmtFull(iso){const m=_cstParts(iso,false);return `${m.year}.${m.month}.${m.day}`}
function fmtTime(iso){const m=_cstParts(iso,true);return `${m.hour}:${m.minute}`}
function fmtFullCST(iso){const m=_cstParts(iso,true);return `${m.year}-${m.month}-${m.day} ${m.hour}:${m.minute} CST`}
function cstDateKey(iso){const m=_cstParts(iso,false);return `${m.year}-${m.month}-${m.day}`}
function formatStructuredSummary(text){
  const lines=String(text||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(lines.length<2||!lines.some(s=>s.includes('｜'))) return `<div class="summary-value">${text||'—'}</div>`;
  return `<div class="structured-summary">${lines.map(line=>{
    const i=line.indexOf('｜');
    const key=i>=0?line.slice(0,i):'结论';const value=i>=0?line.slice(i+1):line;
    return `<div class="summary-line"><span class="summary-key">${key}</span><span class="summary-value">${value}</span></div>`;
  }).join('')}</div>`;
}

/* ---- 01 今日总结 ---- */
let summaryDate='';
function initSummaryDates(){
  const history=SUM.daily_history||{};
  const keys=[...new Set([...Object.keys(history),...RECORDS.map(r=>cstDateKey(r.published_at))])].sort().reverse();
  const current=BUILD_META.build_time_date_label;
  if(current&&!keys.includes(current)) keys.unshift(current);
  summaryDate=keys[0]||current;
  const el=document.getElementById('summary-date');
  el.innerHTML=keys.map(d=>`<option value="${d}">${d}${d===current?' · 最新':''}</option>`).join('');
  el.value=summaryDate;el.onchange=()=>{summaryDate=el.value;renderBrief();};
}
function renderBrief(){
  // 单一今日窗口 (24h 滚动) — 跟 query_today_stats / SUM.today / consensus[0] / 1D 明细共用
  const winLabel = BUILD_META.window_label || '过去 24 小时';
  const isLatest=summaryDate===BUILD_META.build_time_date_label;
  const dayRows=RECORDS.filter(r=>cstDateKey(r.published_at)===summaryDate);
  const dayDirectional=dayRows.filter(r=>['long','short'].includes(r.direction)&&!r.is_retro&&!r.is_disc);
  const bks=[...new Set(dayRows.map(r=>r.bottleneck).filter(Boolean))];
  const postsN = isLatest ? TODAY_STATS.n_posts_24h : new Set(dayRows.map(r=>r.post_id)).size;
  const dirN   = isLatest ? TODAY_STATS.n_directional_24h : dayDirectional.length;
  const bkN    = isLatest ? TODAY_STATS.n_bottlenecks_24h : bks.length;
  const hot    = isLatest ? TODAY_STATS.hot_bottlenecks_24h : bks.slice(0,3).map(name=>({name,count:dayRows.filter(r=>r.bottleneck===name).length}));
  const emptyReason = postsN===0?'no_posts':(dirN===0?'no_directional':null);
  const archived=(SUM.daily_history||{})[summaryDate];
  const fallbackSummary=dayRows.length
    ? `当日共 ${new Set(dayRows.map(r=>r.post_id)).size} 条有效动态：`+dayRows.slice(0,5).map(r=>r.summary||r.raw_text||'').filter(Boolean).join('；')
    : '该日无有效动态。';
  const summaryText = archived&&archived.summary ? archived.summary : (isLatest&&SUM.today ? SUM.today : fallbackSummary);

  let emptyNotice = '';
  if (emptyReason === 'no_posts') {
    emptyNotice = `<div class="bempty warn">⚠ ${winLabel} 未抓到新推文, 总结基于历史趋势</div>`;
  } else if (emptyReason === 'no_directional') {
    emptyNotice = `<div class="bempty info">ℹ ${winLabel} 新增 ${postsN} 条推文, 但无新增方向性投资判断 (long/short)</div>`;
  }
  const winStartLabel = fmtFullCST(BUILD_META.window_start_utc);
  const winEndLabel = fmtFullCST(BUILD_META.window_end_utc);
  const dataUntilLabel = BUILD_META.data_until_label || '—';
  document.getElementById('brief').innerHTML=`
    <div class="bh"><span class="blabel">◆ Daily Brief</span><span class="bdate">${summaryDate}</span><span class="bdate-sub">${isLatest?'最新批次 · '+winLabel:'历史归档'}</span></div>
    <div class="bwin">统计窗口: ${winStartLabel} ~ ${winEndLabel} · 数据截至: ${dataUntilLabel}</div>
    ${emptyNotice}
    <div class="btext">${formatStructuredSummary(summaryText)}</div>
    <div class="bstrip">
      <div class="bstat"><span class="v">${postsN}</span><span class="k">posts · ${winLabel}</span></div>
      <div class="bstat"><span class="v cy">${dirN}</span><span class="k">方向表态 · ${winLabel}</span></div>
      <div class="bstat"><span class="v am">${bkN}</span><span class="k">涉及卡点 · ${winLabel}</span></div>
      <div class="bhot">${hot.map(h => `<span class="tag bk">${h.name} ·${h.count}</span>`).join('')}</div>
    </div>`;
}

/* 顶部 live 元信息 + 页脚 */
function renderLiveMeta(){
  const dataUntilTxt = BUILD_META.data_until_label || '—';
  const txt = `生成 ${BUILD_META.build_time_label} · 数据截至 ${dataUntilTxt}`;
  const el = document.getElementById('live-text');
  if (el) el.textContent = txt;
  const f1 = document.getElementById('foot-build');
  const f2 = document.getElementById('foot-datauntil');
  if (f1) f1.textContent = `生成 ${BUILD_META.build_time_label}`;
  if (f2) f2.textContent = `数据截至 ${dataUntilTxt}`;
}

/* ---- 02 近期态度 ---- */
let win=3;
function renderStance(){
  // consensus
  document.getElementById('consensus').innerHTML=`
    <div class="ch"><span class="clabel">◇ 近期四人共识</span><span class="cwin">${winLabel(win)}</span></div>
    <div class="ctext">${formatStructuredSummary(SUM.consensus[win])}</div>`;
  let cut;
  if(win===0){
    // 1D: 24h 滚动窗口 (跟 query_today_stats / SUM.consensus[0] / SUM.person[*][0] / renderBrief 共用同一窗口)
    cut = new Date(BUILD_META.window_start_utc);
  } else { cut=new Date(); cut.setMonth(cut.getMonth()-win); }
  // 1D 必须使用 TODAY_RECORDS (含所有 raw_posts, 包括无 extraction 的普通推文)
  // 1M/3M/6M/1Y 仍用 RECORDS (有效判断)
  const dataSrc = (win===0) ? TODAY_RECORDS : RECORDS;
  const g=document.getElementById('stancegrid');
  g.innerHTML=ORDER.map(key=>{
    const k=KOLS[key];const c=COLORS[key];
    let recs = dataSrc.filter(r=>r.kol===key&&new Date(r.published_at)>=cut);
    if (win===0) {
      // 1D: 全部推文 (含普通动态), 区分有效 vs 普通
      recs = recs.slice().sort((a,b)=>new Date(b.published_at)-new Date(a.published_at)).slice(0,4);
    } else {
      // 1M/3M/6M/1Y: 仅有效判断 (long/short 或有 bottleneck)
      recs = recs.filter(r=>(r.direction!=='neutral'||r.bottleneck))
        .slice().sort((a,b)=>new Date(b.published_at)-new Date(a.published_at)).slice(0,4);
    }
    const rows=recs.length?recs.map(r=>{
      const ic=r.direction==='long'?'▲':r.direction==='short'?'▼':'•';
      const isOrdinary = (r.direction==='neutral' && !r.bottleneck);
      const bkStrong=r.bottleneck&&(k.strong||[]).some(s=>r.bottleneck.includes(s)||s.includes(r.bottleneck));
      const flags=[];if(r.is_disc)flags.push('<span class="flag">持仓披露</span>');if(r.is_retro)flags.push('<span class="flag">回顾</span>');
      const tk=(r.ticker||[]).map(t=>`<span class="tag">${t}</span>`).join('');
      const bk=r.bottleneck?`<span class="tag bk">${r.bottleneck}</span>`:'';
      const ft=r.bottleneck?(bkStrong?'<span class="tag strong">强项</span>':'<span class="tag weak">盲区</span>'):'';
      const ordinaryTag = isOrdinary ? '<span class="tag ordinary">普通动态</span>' : '';
      return `<div class="stmt"><div class="dir ${r.direction}">${ic}</div><div class="body">
        <div class="txt">${r.summary||r.raw_text||''}</div>
        <div class="meta">${tk}${bk}${ft}${ordinaryTag}${flags.join('')}<span class="tag date">${fmtFull(r.published_at)}</span></div></div></div>`;
    }).join(''):(win===0
      ? `<div class="stmt"><div class="dir neutral">·</div><div class="body"><div class="txt" style="color:var(--ink-faint)">${winLabel(0)} 无新推文</div></div></div>`
      : `<div class="stmt"><div class="dir neutral">·</div><div class="body"><div class="txt" style="color:var(--ink-faint)">该窗口内无强项方向性表态</div></div></div>`);
    const psum=(SUM.person[key]&&SUM.person[key][win])||'';
    return `<div class="stance">
      <div class="sh"><div class="av" style="background:${c}">${initials(k.name)}</div>
        <div class="nm">${k.name}</div><div class="tp ${k.type}">${k.type}</div><div class="ct">${recs.length} 条</div></div>
      <div class="psum"><span class="lead">${winLabel(win)} · 核心立场</span>${formatStructuredSummary(psum)}</div>
      ${rows}</div>`;
  }).join('');
}
function winLabel(w){return ({0:'今日',1:'近 1 个月',3:'近 3 个月',6:'近 6 个月',12:'近 1 年'})[w]}

/* ---- 03 近期明细：按人筛选 + 全量分页 ---- */
let feedKol='all',feedPage=1,feedSize=30;
function initKolFilters(){
  const options=`<option value="all">全部人物</option>`+ORDER.map(k=>`<option value="${k}">${KOLS[k].name}</option>`).join('');
  document.getElementById('feed-kol').innerHTML=options;
  document.getElementById('perf-kol').innerHTML=options;
  document.getElementById('feed-kol').onchange=e=>{feedKol=e.target.value;feedPage=1;renderFeed();};
  document.getElementById('feed-size').onchange=e=>{feedSize=+e.target.value;feedPage=1;renderFeed();};
}
function renderFeed(){
  // TODAY_RECORDS 优先 (含所有 raw_posts, 包括无 extraction 的普通推文)
  // RECORDS 是有效判断. 合并去重 (按 post_id), TODAY 领先
  const seen = new Set();
  const merged = [];
  for (const r of (TODAY_RECORDS || [])) {
    if (!seen.has(r.post_id)) { seen.add(r.post_id); merged.push(r); }
  }
  for (const r of (RECORDS || [])) {
    if (!seen.has(r.post_id)) { seen.add(r.post_id); merged.push(r); }
  }
  const sorted = merged.filter(r=>feedKol==='all'||r.kol===feedKol)
    .sort((a,b)=>new Date(b.published_at)-new Date(a.published_at));
  // 顶部今日窗口横幅: 明确窗口跟计数
  const feedEmpty = document.getElementById('feed-empty');
  const winLabel = BUILD_META.window_label || '过去 24 小时';
  // 明确显示 窗口 跟 数据截止
  const winStartLabel = fmtFullCST(BUILD_META.window_start_utc);
  const winEndLabel = fmtFullCST(BUILD_META.window_end_utc);
  const dataUntilLabel = BUILD_META.data_until_label || '—';
  if (feedEmpty) {
    // 顶部: 窗口范围
    let winText = `统计窗口: ${winStartLabel} ~ ${winEndLabel} · 数据截至: ${dataUntilLabel}`;
    if (TODAY_STATS.empty_reason === 'no_posts') {
      feedEmpty.className = 'feed-empty warn';
      feedEmpty.innerHTML = `⚠ ${winLabel} 未抓到新推文, 以下为历史近端点<br><span class="win-range">${winText}</span>`;
    } else if (TODAY_STATS.empty_reason === 'no_directional') {
      feedEmpty.className = 'feed-empty';
      feedEmpty.innerHTML = `ℹ ${winLabel} 新增 ${TODAY_STATS.n_posts_24h} 条推文, 但无新增方向性投资判断, 以下混入历史近端点<br><span class="win-range">${winText}</span>`;
    } else {
      feedEmpty.className = 'feed-empty';
      feedEmpty.innerHTML = `✓ ${winLabel} 有 ${TODAY_STATS.n_posts_24h} 条推文, 含 ${TODAY_STATS.n_directional_24h} 条方向性判断<br><span class="win-range">${winText}</span>`;
    }
  }
  // 静默日不假装 - 头部标"最近动态 · N 天前"取代"最新批次 · 今天"
  if(sorted.length){
    const top=sorted[0];
    const now=new Date();
    const diffMs=now - new Date(top.published_at);
    const days=Math.floor(diffMs/86400000);
    const relLabel=days===0?'今天':(days===1?'1 天前':(days<=7?`${days} 天前`:(days<=30?`${days} 天前`:`${days} 天前 (历史)`)));
    const lastDate=fmtFullCST(top.published_at);
    document.getElementById('feed-date').innerHTML=
      `最近动态 · 共 ${sorted.length} 条 · 最新 <b style="color:var(--amber)">${relLabel}</b> (${lastDate})`;
  } else {
    document.getElementById('feed-date').textContent='最近动态 · 暂无数据';
  }
  const pages=Math.max(1,Math.ceil(sorted.length/feedSize));
  feedPage=Math.min(feedPage,pages);
  const show=sorted.slice((feedPage-1)*feedSize,feedPage*feedSize);
  // 静默日警告条 (如果最新一条不是今天)
  let banner='';
  if(sorted.length){
    const top=sorted[0];
    const now=new Date();
    const todayStart=new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const topDate=new Date(top.published_at);
    if(topDate < todayStart){
      const days=Math.floor((now - topDate)/86400000);
      banner=`<div class="banner-silent">⚠ 4 大V 静默 ${days} 天, 以下为最近动态</div>`;
    }
  }
  document.getElementById('feed').innerHTML=banner + show.map(r=>{
    const c=COLORS[r.kol];const k=KOLS[r.kol];
    const tk=(r.ticker||[]).map(t=>`<span class="tag">${t}</span>`).join('');
    const bk=r.bottleneck?`<span class="tag bk">${r.bottleneck}</span>`:'';
    const dp=r.direction!=='neutral'?`<span class="dirpill ${r.direction}">${r.direction}</span>`:'';
    const flags=[];if(r.is_disc)flags.push('<span class="flag">持仓披露</span>');if(r.is_retro)flags.push('<span class="flag">回顾</span>');if(r.is_selfret)flags.push('<span class="flag">自报收益</span>');
    const rb=r.rebuts?`<div class="frebut">反驳叙事 · ${r.rebuts}</div>`:'';
    // 每条标 N 天前
    const now=new Date();
    const diffMs=now - new Date(r.published_at);
    const days=Math.floor(diffMs/86400000);
    let rtLabel, rtCls;
    if(days===0){rtLabel='今天';rtCls='rt-today';}
    else if(days===1){rtLabel='1 天前';rtCls='rt-1d';}
    else if(days<=7){rtLabel=`${days} 天前`;rtCls='rt-recent';}
    else if(days<=30){rtLabel=`${days} 天前`;rtCls='rt-mid';}
    else{rtLabel=`${days} 天前`;rtCls='rt-old';}
    return `<div class="fitem"><div class="ftime">${fmtDate(r.published_at)}<br>${fmtTime(r.published_at)}<br><span class="rel ${rtCls}">${rtLabel}</span></div>
      <div class="frail"><div class="fav" style="background:${c}">${initials(k.name)}</div><div class="fline"></div></div>
      <div class="fbody"><div class="ftop"><span class="fnm">${k.name}</span>${dp}${tk}${bk}${flags.join('')}</div>
        <div class="fsum">${r.summary||r.raw_text||''}</div>${rb}
        <div class="frow"><span class="atb ${r.attribution}">${r.attribution||'NA'}</span><a class="flink" href="${r.raw_url}" target="_blank">view on X ↗</a></div></div></div>`;
  }).join('');
  document.getElementById('feed-pager').innerHTML=`<button id="feed-prev" ${feedPage<=1?'disabled':''}>上一页</button>
    <span>第 ${feedPage} / ${pages} 页 · 共 ${sorted.length} 条</span>
    <button id="feed-next" ${feedPage>=pages?'disabled':''}>下一页</button>`;
  document.getElementById('feed-prev').onclick=()=>{if(feedPage>1){feedPage--;renderFeed();}};
  document.getElementById('feed-next').onclick=()=>{if(feedPage<pages){feedPage++;renderFeed();}};
  document.getElementById('foot-count').textContent=`${sorted.length} 条 records`;
}

/* ---- 04 标的 ---- */
let perfKol='all',perfDays=30;
function renderTickers(){
  const cut=Date.now()-perfDays*86400000;
  const rows=CALL_PERFORMANCE.filter(t=>(perfKol==='all'||t.kol===perfKol)&&new Date(t.published_at).getTime()>=cut);
  const valid=rows.filter(t=>t.directional_return!=null);
  const avg=valid.length?valid.reduce((s,t)=>s+t.directional_return,0)/valid.length:null;
  const wins=valid.filter(t=>t.directional_return>0).length;
  const longRows=valid.filter(t=>t.direction==='long'),shortRows=valid.filter(t=>t.direction==='short');
  const mean=a=>a.length?a.reduce((s,t)=>s+t.directional_return,0)/a.length:null;
  const fmt=v=>v==null?'—':`${v>=0?'+':''}${v.toFixed(1)}%`;
  const best=valid.length?[...valid].sort((a,b)=>b.directional_return-a.directional_return)[0]:null;
  document.getElementById('perf-summary').innerHTML=`
    <div class="perfstat"><span class="v ${avg>=0?'pos':'neg'}">${fmt(avg)}</span><span class="k">综合等权方向收益</span></div>
    <div class="perfstat"><span class="v">${valid.length?wins+'/'+valid.length:'—'}</span><span class="k">胜率 ${valid.length?(wins/valid.length*100).toFixed(0)+'%':'—'}</span></div>
    <div class="perfstat"><span class="v">${fmt(mean(longRows))}</span><span class="k">Long 平均表现</span></div>
    <div class="perfstat"><span class="v">${fmt(mean(shortRows))}</span><span class="k">Short 平均表现</span></div>
    <div class="perfstat"><span class="v">${best?best.ticker+' '+fmt(best.directional_return):'—'}</span><span class="k">最佳喊单 · 行情覆盖 ${valid.length}/${rows.length}</span></div>`;
  document.getElementById('tbody').innerHTML=rows.map(t=>{
    const c=COLORS[t.kol];const k=KOLS[t.kol];
    const cp=t.call_price==null?'—':`$${Number(t.call_price).toFixed(2)}`;
    const np=t.now_price==null?'—':`$${Number(t.now_price).toFixed(2)}`;
    const dirRet=fmt(t.directional_return);
    const cls=t.directional_return==null?'':(t.directional_return>=0?'in':'out');
    return `<tr><td><span class="tk ${t.direction}">${t.ticker}</span></td>
      <td><div class="by"><div class="av" style="background:${c}">${initials(k.name)}</div><span class="nm">${k.name}</span> <span class="dirpill2 ${t.direction}">${t.direction}</span></div></td>
      <td><span class="when">首次 ${fmtFull(t.published_at)}<br>最近 ${fmtFull(t.latest_published_at||t.published_at)} · ${t.n_mentions||1} 次</span></td>
      <td><span class="when">${cp}</span></td>
      <td><span class="when">${np}</span> &nbsp;<span class="circle ${cls}">${dirRet}</span></td>
      <td><span class="circle ${cls}">${t.direction==='short'?'已反向计分':'按涨跌计分'}</span></td>
      <td>${t.in_field?'<span class="tag strong">强项</span>':'<span class="tag weak">圈外</span>'}</td>
      <td><span class="when">${t.now_date||'行情待补'}</span></td></tr>`;
  }).join('');
}

/* ---- 05 人物卡 ---- */
function renderKols(){
  document.getElementById('kolgrid').innerHTML=ORDER.map(key=>{
    const k=KOLS[key];const c=COLORS[key];
    const st=(k.strong||[]).map(s=>`<span class="chip s">${s}</span>`).join('');
    const wk=(k.weak||[]).map(s=>`<span class="chip w">${s}</span>`).join('');
    return `<div class="kol" data-type="${k.type}" style="--accent:${c}">
      <div class="khead"><div class="avatar" style="background:${c}">${initials(k.name)}</div>
        <div><div class="kname">${k.name}</div><div class="khandle">${k.handle}</div></div></div>
      <div class="ktype">${k.typeLabel}</div>
      <div class="kdesc">${k.desc}</div>
      <div class="kgroup strong"><div class="glab">▸ 信他</div><div class="chips">${st}</div></div>
      <div class="kgroup weak"><div class="glab">▸ 略过</div><div class="chips">${wk}</div></div></div>`;
  }).join('');
}

function tick(){const d=new Date();document.getElementById('clock').innerHTML=`<b>${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}</b> CST`;}
setInterval(tick,1000);tick();
document.getElementById('stance-window').onchange=e=>{win=+e.target.value;renderStance();};

initSummaryDates();initKolFilters();
document.getElementById('perf-kol').onchange=e=>{perfKol=e.target.value;renderTickers();};
document.getElementById('perf-window').onchange=e=>{perfDays=+e.target.value;renderTickers();};
renderBrief();renderLiveMeta();renderStance();renderFeed();renderTickers();renderKols();
</script>
</body>
