<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SignalBoard · Research Clue Desk</title>
  <style>
    :root{
      --paper:#f4f5f2;--card:#fff;--ink:#17201d;--muted:#68716d;--faint:#929a96;
      --line:#dfe3df;--line2:#eceeeb;--green:#247454;--green-bg:#e8f3ed;
      --blue:#315da5;--blue-bg:#eaf0fa;--amber:#966a18;--amber-bg:#fbf1db;
      --red:#a54848;--red-bg:#f8eaea;--gray:#707874;--gray-bg:#eef0ee;
      --shadow:0 16px 42px rgba(24,38,31,.07);--radius:17px;
      --serif:Georgia,"Songti SC","Noto Serif CJK SC",serif;
      --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
    button,a{font:inherit}a{color:inherit}.shell{max-width:1260px;margin:auto;padding:0 28px 64px}
    .topbar{height:72px;display:flex;align-items:center;border-bottom:1px solid var(--line);gap:18px}.brand{font:750 13px/1 var(--mono);letter-spacing:.13em}.brand i{font-style:normal;color:var(--green)}.topbar-note{font-size:12px;color:var(--muted);margin-left:auto}.updated{font-size:10px;color:var(--faint);white-space:nowrap}
    .product-layout{display:grid;grid-template-columns:176px minmax(0,980px);gap:42px;align-items:start}.side-nav{position:sticky;top:18px;padding:37px 0 20px;display:grid;gap:3px}.side-label{font:700 9px/1 var(--mono);letter-spacing:.13em;color:var(--faint);margin:0 0 9px 12px}.side-nav button,.side-nav a{border:0;background:transparent;text-align:left;text-decoration:none;color:var(--muted);padding:9px 12px;border-radius:9px;font-size:12px;cursor:pointer;white-space:nowrap}.side-nav button:hover,.side-nav a:hover,.side-nav [data-active="true"]{background:#e9ece8;color:var(--ink)}.side-nav .tools{border-top:1px solid var(--line);margin-top:17px;padding-top:18px;display:grid;gap:3px}.content{min-width:0;max-width:980px}
    .hero{padding:56px 0 30px;border-bottom:1px solid var(--line)}.eyebrow{font:700 10px/1 var(--mono);letter-spacing:.14em;color:var(--green);text-transform:uppercase}.hero h1{font:520 clamp(38px,5.4vw,63px)/1.03 var(--serif);letter-spacing:-.035em;margin:13px 0 10px}.hero .cn-title{font:600 18px/1.35 var(--sans);margin:0 0 13px}.hero p{font-size:15px;color:var(--muted);max-width:720px;margin:0}.summary-strip{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:22px;color:var(--muted);font-size:11px}.summary-strip b{color:var(--ink);font-weight:650}.feed-head{display:flex;align-items:end;justify-content:space-between;margin:30px 0 13px}.feed-head h2{font:600 22px/1.25 var(--serif);margin:0}.feed-head p{margin:0;color:var(--faint);font-size:11px}.clue-list{display:grid;gap:16px}
    .clue-card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:27px 30px;box-shadow:0 8px 28px rgba(27,39,33,.035)}.clue-card:hover{box-shadow:var(--shadow)}.clue-top{display:flex;gap:16px;align-items:flex-start}.clue-title{font:600 25px/1.24 var(--serif);letter-spacing:-.016em;margin:0}.meta{display:flex;gap:7px 13px;align-items:center;flex-wrap:wrap;margin-top:9px;color:var(--faint);font-size:11px}.status{display:inline-flex;border-radius:99px;padding:4px 8px;font:700 9px/1 var(--mono);letter-spacing:.04em}.status.NEW,.status.BUILDING{color:var(--amber);background:var(--amber-bg)}.status.STRENGTHENING,.status.MATURE{color:var(--green);background:var(--green-bg)}.status.WEAKENING{color:var(--amber);background:var(--amber-bg)}.status.CONTRADICTED{color:var(--red);background:var(--red-bg)}.status.DORMANT{color:var(--gray);background:var(--gray-bg)}
    .author-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.author-pill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:11px}.author-pill i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e9ece8;color:var(--ink);font:650 10px/1 var(--sans)}.thesis{font-size:16px;font-weight:610;line-height:1.58;margin:20px 0 17px}.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.brief{border-top:1px solid var(--line2);padding-top:12px}.brief b,.mini-label{display:block;font-size:10px;letter-spacing:.05em;color:var(--faint);margin-bottom:6px}.brief p{margin:0;color:var(--muted);font-size:13px;line-height:1.58}.logic{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:16px 0}.logic span{font-size:11px;background:#f7f8f6;border-radius:99px;padding:4px 8px}.logic i{font-style:normal;color:var(--faint)}
    .chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:10px;border:1px solid var(--line);border-radius:7px;padding:3px 7px;background:#fff;color:var(--muted)}a.chip{text-decoration:none}.chip.blue{color:var(--blue);background:var(--blue-bg);border-color:transparent}.chip.red{color:var(--red);background:var(--red-bg);border-color:transparent}.chip.green{color:var(--green);background:var(--green-bg);border-color:transparent}.recommend{margin-top:17px;border-radius:11px;background:#f5f7f4;padding:11px 13px;color:var(--muted);font-size:12px}.recommend b{color:var(--green);margin-right:7px}.card-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.btn{border:1px solid var(--line);border-radius:9px;padding:8px 13px;background:#fff;cursor:pointer;font-size:11px;color:var(--ink);text-decoration:none}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.all-link{margin-top:22px;text-align:center}.all-link a{color:var(--green);font-weight:650;text-decoration:none}
    .page{padding-top:38px}.back{border:0;background:transparent;padding:8px 0;color:var(--muted);cursor:pointer;font-size:12px}.detail-hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 38px;margin-top:10px;box-shadow:var(--shadow)}.detail-hero h1{font:500 clamp(32px,5vw,54px)/1.08 var(--serif);letter-spacing:-.035em;margin:12px 0 15px;max-width:920px}.detail-summary{font-size:18px;font-weight:570;line-height:1.55;max-width:900px}.detail-meta{display:flex;flex-wrap:wrap;gap:9px 18px;margin-top:20px;color:var(--muted);font-size:11px}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:28px;margin-top:28px}.detail-main,.detail-side{min-width:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:15px}.panel h2{font:700 10px/1 var(--mono);letter-spacing:.11em;margin:0 0 17px}.panel h3{font-size:12px;margin:15px 0 7px}.panel p{color:var(--muted);margin:0 0 10px}.panel ul,.panel ol{margin:0;padding-left:20px;color:var(--muted)}.panel li{margin:7px 0}.metric-row{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid var(--line2);padding:10px 0;font-size:11px}.metric-row:first-of-type{border-top:0}.metric-row span{color:var(--muted)}
    .timeline{position:relative;margin-left:8px}.timeline:before{content:"";position:absolute;left:8px;top:7px;bottom:7px;width:1px;background:var(--line)}.event{position:relative;padding:0 0 25px 37px}.event:last-child{padding-bottom:0}.event:before{content:"";position:absolute;left:3px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--blue)}.event.CONTRADICTION:before,.event.NEW_RISK:before{border-color:var(--red)}.event.THESIS_ORIGIN:before{border-color:var(--green)}.event-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.event-date{font:650 10px/1 var(--mono);color:var(--faint)}.event-type{font:700 9px/1 var(--mono);letter-spacing:.07em;color:var(--blue)}.event h3{font-size:13px;margin:8px 0 4px}.event p{font-size:12px;line-height:1.55;margin:4px 0;color:var(--muted)}.event .meaning{border-left:2px solid var(--line);padding-left:9px}.post-link{font-size:10px;color:var(--blue);text-decoration:none}.quote{margin:8px 0 0;border-left:2px solid var(--line);padding:6px 10px;background:#f8f9f7;font-size:11px;color:var(--muted)}
    .media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.media-card{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fafbf9}.media-card img{display:block;width:100%;height:150px;object-fit:cover;background:#eef0ed}.media-card div{padding:9px;font-size:10.5px;color:var(--muted)}.evidence-root{padding:10px 0;border-top:1px solid var(--line2);overflow-wrap:anywhere}.evidence-root:first-of-type{border-top:0}.evidence-root a{font-weight:650;font-size:12px;text-decoration:none}.evidence-root p{font-size:11px;margin:3px 0}.layer{font:700 8.5px/1 var(--mono);letter-spacing:.08em;color:var(--blue)}
    .evolution{display:grid;gap:10px}.author-line{border:1px solid var(--line2);border-radius:11px;padding:13px}.author-line b{font-size:12px}.author-line .views{display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:8px;margin-top:8px}.author-line p{font-size:11px;margin:0}.arrow{text-align:center;color:var(--faint)}.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ai-block{border:1px solid var(--line2);border-radius:11px;padding:13px}.ai-block h3{font:700 9px/1 var(--mono);letter-spacing:.08em;margin:0 0 8px}.ai-block ul{font-size:11.5px}.ai-block.right h3{color:var(--green)}.ai-block.wrong h3{color:var(--red)}.ai-block.unknown h3{color:var(--amber)}.ai-block.next{grid-column:1/-1}
    .profile-head{display:flex;gap:12px;align-items:center;margin-bottom:22px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:white;font:600 18px/1 var(--serif)}.profile-head h1{font:500 35px/1.1 var(--serif);margin:0}.research-line{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-bottom:10px}.research-line h3{font:600 19px/1.3 var(--serif);margin:0}.research-line a{text-decoration:none}.empty{padding:50px;text-align:center;color:var(--muted)}
    .evidence-hero{padding:46px 0 25px;border-bottom:1px solid var(--line)}.evidence-hero h1{font:520 clamp(33px,5vw,52px)/1.08 var(--serif);letter-spacing:-.03em;margin:12px 0}.source-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:12px}.source-bar a{color:var(--blue);text-decoration:none}.original-content{font:500 20px/1.62 var(--serif);white-space:pre-wrap;color:var(--ink)!important}.evidence-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.evidence-list{display:grid;gap:12px}.evidence-item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:21px 23px;text-decoration:none}.evidence-item:hover{box-shadow:var(--shadow)}.evidence-item h3{font:600 19px/1.35 var(--serif);margin:7px 0}.evidence-item p{margin:0;color:var(--muted)}
    .company-map{display:grid;gap:14px}.company-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:24px 26px}.company-card h2{font:600 24px/1.3 var(--serif);margin:0 0 6px}.company-card h2 a{text-decoration:none}.company-card .mechanism{font-size:14px;color:var(--muted);margin:14px 0}.company-card .evidence-link{color:var(--blue);font-size:11px;text-decoration:none}.company-index{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.company-index .company-card{padding:20px}.company-index .company-card h2{font-size:20px}
    .footer{border-top:1px solid var(--line);margin-top:50px;padding-top:18px;color:var(--faint);font-size:10.5px;display:flex;justify-content:space-between;gap:20px}
    @media(max-width:980px){.shell{padding:0 18px 45px}.product-layout{grid-template-columns:1fr;gap:0}.side-nav{position:static;padding:12px 0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:3px}.side-nav .side-label,.side-nav .tools{display:none}.side-nav button,.side-nav a{flex:0 0 auto}.content{max-width:none}.detail-grid{grid-template-columns:1fr}.detail-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-side .panel{margin:0}}
    @media(max-width:620px){.shell{padding:0 13px 38px}.topbar{height:62px}.topbar-note{display:none}.updated{margin-left:auto}.hero{padding:38px 0 24px}.hero h1{font-size:38px}.hero .cn-title{font-size:16px}.feed-head{align-items:start;gap:12px}.feed-head p{text-align:right}.clue-card{padding:21px 17px}.clue-title{font-size:21px}.brief-grid,.detail-side,.media-grid,.ai-grid,.company-index{grid-template-columns:1fr}.clue-card,.panel,.detail-hero,.evidence-item,.company-card{overflow:hidden}.panel p,.panel li,.clue-title,.thesis,.original-content{overflow-wrap:anywhere}.detail-hero{padding:25px 19px}.detail-hero h1{font-size:35px}.panel{padding:18px 15px}.author-line .views{grid-template-columns:1fr}.arrow{text-align:left}.card-foot{justify-content:stretch}.card-foot .btn{flex:1;text-align:center}.evidence-nav{flex-direction:column}.footer{display:block}.summary-strip{gap:6px 12px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand">SIGNAL<i>BOARD</i></div><div class="topbar-note">Research Brief · conclusions separated from evidence</div><div class="updated" id="updated"></div></header>
    <div class="product-layout">
      <nav class="side-nav" aria-label="Primary navigation">
        <div class="side-label">RESEARCH</div>
        <button data-nav="today" onclick="goHome()">01&nbsp;&nbsp;今日线索</button>
        <a data-nav="all" href="#all">02&nbsp;&nbsp;全部研究线</a>
        <a data-nav="authors" href="#authors">03&nbsp;&nbsp;作者</a>
        <a data-nav="themes" href="#themes">04&nbsp;&nbsp;主题</a>
        <a data-nav="companies" href="/companies/">05&nbsp;&nbsp;标的</a>
        <a data-nav="evidence" href="/evidence/">06&nbsp;&nbsp;原始 Post</a>
        <div class="tools"><div class="side-label">RESEARCH TOOLS</div><a data-nav="changes" href="/research-changes/">Research Changes</a><a href="/admin/">Admin</a></div>
      </nav>
      <main id="app" class="content"></main>
    </div>
    <footer class="footer"><span>Research clues are starting points, not investment recommendations.</span><span>SignalBoard · Research Clue Desk v1.6.2</span></footer>
  </div>
  <script id="clue-data" type="application/json">__RESEARCH_CLUES__</script>
  <script>
    const DATA=JSON.parse(document.getElementById('clue-data').textContent),CLUES=DATA.clues||[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const arr=x=>Array.isArray(x)?x:[];
    const app=document.getElementById('app');
    const short=(s,n=190)=>String(s||'').length>n?String(s).slice(0,n).replace(/[^。；;,.]*$/,'')+'…':String(s||'');
    const eventLabel=type=>({THESIS_ORIGIN:'Research origin',NEW_EVIDENCE:'New evidence',THESIS_EXPANSION:'Thesis expanded',CONFIDENCE_UP:'Confidence strengthened',CONFIDENCE_DOWN:'Confidence weakened',NEW_RISK:'New risk',NEW_COMPANY:'Company added',CATALYST:'Catalyst',CONTRADICTION:'Contradiction',THESIS_UPDATE:'Research update'}[type]||String(type||'Research update').replaceAll('_',' '));
    const latestDate=CLUES.map(c=>c.last_updated).sort().at(-1)||'';
    document.getElementById('updated').textContent=`Updated ${latestDate}`;
    const setActiveNav=key=>document.querySelectorAll('[data-nav]').forEach(x=>x.dataset.active=String(x.dataset.nav===key));
    const authorPills=c=>arr(c.authors).slice(0,4).map(a=>`<a class="author-pill" href="/#author/${encodeURIComponent(a)}"><i>${esc(a.slice(0,1).toUpperCase())}</i>${esc(a)}</a>`).join('');
    const authors=c=>arr(c.authors).slice(0,4).map(a=>`<a class="chip" href="/#author/${encodeURIComponent(a)}">${esc(a)}</a>`).join('');
    const companies=c=>arr(c.related_companies).slice(0,6).map(x=>{const n=x.ticker||x.name;return `<a class="chip ${x.exposure==='POSITIVE'?'green':x.exposure==='NEGATIVE'?'red':''}" href="/companies/?ticker=${encodeURIComponent(n)}">${esc(n)}</a>`}).join('')||'<span class="chip">暂无明确上市公司映射</span>';
    const evidenceHref=(c,index)=>`/evidence/?clue=${encodeURIComponent(c.clue_id)}&event=${Number.isInteger(index)?index:Math.max(0,arr(c.timeline).length-1)}`;
    const whyRecommended=c=>c.status==='CONTRADICTED'?'关键 Claim 被新证据否定，需要优先核对。':c.status==='NEW'?`这是最新形成的研究线索，已有 ${c.independent_evidence_roots} 个独立证据根。`:c.status==='STRENGTHENING'?`已累积 ${c.independent_evidence_roots} 个独立证据根，研究强度正在上升。`:arr(c.authors).length>=3?`该线索已扩展为 ${arr(c.authors).length} 名作者共同讨论。`:arr(c.recommendation_reasons)[0]||'近期出现值得继续追踪的研究变化。';
    function recommendedClues(){
      const rows=[];const add=(status,n)=>CLUES.filter(c=>c.status===status).sort((a,b)=>a.priority-b.priority).slice(0,n).forEach(c=>{if(!rows.includes(c))rows.push(c)});
      add('STRENGTHENING',3);add('NEW',1);add('BUILDING',2);add('CONTRADICTED',1);
      CLUES.slice().sort((a,b)=>a.priority-b.priority).forEach(c=>{if(rows.length<7&&!rows.includes(c))rows.push(c)});
      return rows.slice(0,7);
    }
    function card(c){
      const logic=arr(c.short_logic_chain).slice(0,6).map((x,i)=>`${i?'<i>→</i>':''}<span>${esc(short(x,72))}</span>`).join('');
      return `<article class="clue-card"><div class="clue-top"><div><h3 class="clue-title"><a href="/#clue/${encodeURIComponent(c.clue_id)}">${esc(c.title)}</a></h3><div class="meta"><span class="status ${esc(c.status)}">${esc(c.status)}</span><a href="/#theme/${encodeURIComponent(c.theme)}">${esc(c.theme)}</a><span>${esc(c.first_seen)} → ${esc(c.last_updated)}</span></div><div class="author-row">${authorPills(c)}</div></div></div>
        <p class="thesis">${esc(c.one_line_thesis)}</p><div class="brief-grid"><div class="brief"><b>WHY THIS MATTERS</b><p>${esc(short(c.why_this_matters,245))}</p></div><div class="brief"><b>WHAT CHANGED</b><p>${esc(short(c.what_changed,220))}</p></div></div>
        <span class="mini-label" style="margin-top:16px">SHORT LOGIC CHAIN</span><div class="logic">${logic}</div><div class="brief-grid"><div class="brief"><b>RELATED COMPANIES</b><div class="chips">${companies(c)}</div></div><div class="brief"><b>AI INITIAL VIEW</b><p>${esc(short(c.ai_initial_view,220))}</p></div></div>
        <div class="recommend"><b>WHY RECOMMENDED</b>${esc(whyRecommended(c))}</div><div class="card-foot"><a class="btn" href="/#clue/${encodeURIComponent(c.clue_id)}/timeline">View Timeline</a><a class="btn primary" href="${evidenceHref(c)}">View Evidence</a></div></article>`;
    }
    function home(){
      setActiveNav('today');const rows=recommendedClues();
      app.innerHTML=`<section class="hero"><div class="eyebrow">Research Clue Desk</div><h1>TODAY'S RESEARCH CLUES</h1><div class="cn-title">今日研究线索</div><p>把四万多条 Post、引用链、图片和外部资料，压缩成今天最值得继续研究的线索。首页只做推荐，完整证据与审计进入详情页。</p><div class="summary-strip"><span><b>${CLUES.length}</b> active research lines</span><span><b>${CLUES.filter(c=>c.status==='STRENGTHENING').length}</b> strengthening</span><span><b>${CLUES.filter(c=>c.status==='BUILDING').length}</b> building</span><span><b>${CLUES.filter(c=>c.status==='CONTRADICTED').length}</b> contradicted</span><span>Updated ${esc(latestDate)}</span></div></section>
        <div class="feed-head"><h2>今天优先看</h2><p>${rows.length} 条推荐 · 每条约 15–20 秒</p></div><div class="clue-list">${rows.map(card).join('')}</div><div class="all-link"><a href="#all">查看全部 ${CLUES.length} 条研究线 →</a></div>`;
      window.scrollTo(0,0);
    }
    function compactLine(c){return `<article class="research-line"><h3><a href="/#clue/${encodeURIComponent(c.clue_id)}">${esc(c.title)}</a></h3><div class="meta"><span class="status ${esc(c.status)}">${esc(c.status)}</span><span>${esc(c.first_seen)} → ${esc(c.last_updated)}</span><span>${esc(arr(c.authors).join(' · '))}</span></div><p>${esc(c.one_line_thesis)}</p><div class="chips">${companies(c)}</div></article>`}
    function showAllClues(){setActiveNav('all');app.innerHTML=`<div class="page"><div class="profile-head"><div class="avatar">${CLUES.length}</div><div><div class="eyebrow">COMPLETE RESEARCH INDEX</div><h1>全部研究线</h1></div></div>${CLUES.slice().sort((a,b)=>a.priority-b.priority).map(compactLine).join('')}</div>`;window.scrollTo(0,0)}
    function showResearchChanges(){setActiveNav('changes');const rows=CLUES.slice().sort((a,b)=>String(b.last_updated).localeCompare(String(a.last_updated))||a.priority-b.priority);app.innerHTML=`<div class="page"><div class="profile-head"><div class="avatar">Δ</div><div><div class="eyebrow">RESEARCH BRIEF</div><h1>LATEST RESEARCH CHANGES</h1></div></div><section class="panel"><p>研究线最近发生了什么变化。完整时间线与证据保留在 Clue Detail，不在这里展开内部审计。</p></section>${rows.map(c=>`<article class="research-line"><h3><a href="/#clue/${encodeURIComponent(c.clue_id)}">${esc(c.title)}</a></h3><div class="meta"><span class="status ${esc(c.status)}">${esc(c.status)}</span><span>${esc(c.first_seen)} → ${esc(c.last_updated)}</span><span>${esc(arr(c.authors).slice(0,4).join(' · '))}</span></div><p><b>What changed:</b> ${esc(c.what_changed)}</p><div class="card-foot"><a class="btn" href="/#clue/${encodeURIComponent(c.clue_id)}/timeline">View Timeline</a><a class="btn primary" href="${evidenceHref(c)}">View Evidence</a></div></article>`).join('')}</div>`;window.scrollTo(0,0)}
    function evidenceRoots(c){
      const layers=['PRIMARY_EVIDENCE','SECONDARY_EVIDENCE','AUTHOR_INTERPRETATION'];
      return layers.map(layer=>{const roots=arr(c.evidence_roots).filter(x=>x.layer===layer);if(!roots.length)return'';return `<h3>${layer.replaceAll('_',' ')}</h3>${roots.map(r=>`<div class="evidence-root"><span class="layer">${esc(r.publisher||layer)}</span><br>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noreferrer">${esc(r.title)}</a>`:`<b>${esc(r.title)}</b>`}<p>${esc(r.finding||'Source retained for independent-root deduplication.')}</p></div>`).join('')}`}).join('');
    }
    function media(m){return `<div class="media-card">${m.thumbnail_url?`<img src="${esc(m.thumbnail_url)}" alt="Evidence media" loading="lazy" onerror="this.style.display='none'">`:''}<div><b>${esc(m.detected_source||m.media_type||'Media evidence')}</b><br>${esc(m.summary||'Existing completed media analysis')}</div></div>`}
    function event(c,e,index){return `<article class="event ${esc(e.event_type)}"><div class="event-top"><span class="event-date">${esc(e.date)}</span><span class="event-type">${esc(eventLabel(e.event_type))}</span><a class="chip" href="/#author/${encodeURIComponent(e.author)}">${esc(e.author)}</a></div><h3>${esc(e.what_changed)}</h3>${e.post?`<p>${esc(short(e.post,360))}</p>`:''}<p class="meaning"><b>Why important:</b> ${esc(e.ai_interpretation)}</p><a class="post-link" href="${evidenceHref(c,index)}">View Evidence →</a></article>`}
    const quoteChain=c=>arr(c.timeline).flatMap(e=>arr(e.quoted_posts).map(q=>({...q,quoted_by:e.author,quoted_at:e.date})));
    const clueMedia=c=>arr(c.timeline).flatMap(e=>arr(e.media));
    function list(items){return `<ul>${arr(items).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
    function exposureList(items){return `<ul>${arr(items).map(x=>`<li><b>${esc(x.ticker||x.name||'Exposure')}</b>${x.mechanism?` — ${esc(x.mechanism)}`:''}</li>`).join('')}</ul>`}
    function sourceName(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch{return 'Source post'}}
    function evidenceItem(c,e,index){return `<a class="evidence-item" href="${evidenceHref(c,index)}"><div class="meta"><span>${esc(e.date)}</span><span>${esc(e.author)}</span><span>${esc(sourceName(e.post_url))}</span></div><h3>${esc(e.what_changed)}</h3><p>${esc(short(e.post,210))}</p></a>`}
    function showEvidenceIndex(){setActiveNav('evidence');const rows=CLUES.flatMap(c=>arr(c.timeline).map((e,index)=>({c,e,index}))).sort((a,b)=>String(b.e.date).localeCompare(String(a.e.date)));app.innerHTML=`<div class="page"><div class="profile-head"><div class="avatar">E</div><div><div class="eyebrow">SOURCE LIBRARY</div><h1>Evidence</h1></div></div><section class="panel"><p>这里保留原始内容、引用链、媒体和提取事实。点击任一证据后仍处于 Research Clue Desk，不再跳回旧 Social/Data UI。</p></section><div class="evidence-list">${rows.map(x=>evidenceItem(x.c,x.e,x.index)).join('')}</div></div>`;window.scrollTo(0,0)}
    function evidenceDetail(c,index){setActiveNav('evidence');const events=arr(c.timeline);const safe=Math.min(Math.max(Number(index)||0,0),Math.max(events.length-1,0));const e=events[safe]||{};const quotes=arr(e.quoted_posts);const mediaItems=arr(e.media);app.innerHTML=`<div class="page"><a class="back" href="/#clue/${encodeURIComponent(c.clue_id)}">← Back to Clue Detail</a><section class="evidence-hero"><div class="eyebrow">EVIDENCE DETAIL</div><h1>${esc(e.what_changed||c.title)}</h1><div class="source-bar"><span><b>Source</b> ${esc(sourceName(e.post_url))}</span><span><b>Author</b> ${esc(e.author||'Unknown author')}</span><span><b>Date</b> ${esc(e.date||'Unknown date')}</span>${e.post_url?`<a href="${esc(e.post_url)}" target="_blank" rel="noreferrer">Open source ↗</a>`:''}</div></section><div class="detail-grid"><div class="detail-main"><section class="panel"><h2>ORIGINAL CONTENT</h2><p class="original-content">${esc(e.post||'Original content is not retained in the approved artifact.')}</p></section><section class="panel"><h2>QUOTE CHAIN</h2>${quotes.length?quotes.map(q=>`<div class="quote"><b>${esc(q.author||'Quoted source')} · ${esc(q.date||'')}</b><br>${esc(q.text||q.url)}</div>`).join(''):'<p>No retained quote-chain node for this evidence.</p>'}</section><section class="panel"><h2>MEDIA</h2>${mediaItems.length?`<div class="media-grid">${mediaItems.map(media).join('')}</div>`:'<p>No media attached to this evidence node.</p>'}</section><section class="panel"><h2>EXTRACTED FACTS</h2>${arr(e.claims).length?list(e.claims):'<p>No extracted fact is retained for this node.</p>'}</section><section class="panel"><h2>WHY IMPORTANT</h2><p>${esc(e.ai_interpretation||e.what_changed)}</p></section></div><aside class="detail-side"><section class="panel"><h2>RELATED CLUE</h2><h3>${esc(c.title)}</h3><p>${esc(c.one_line_thesis)}</p><a class="btn primary" href="/#clue/${encodeURIComponent(c.clue_id)}">View Clue Detail</a></section><section class="panel"><h2>CONTEXT</h2><div class="metric-row"><span>Author</span><b>${esc(e.author||'—')}</b></div><div class="metric-row"><span>Date</span><b>${esc(e.date||'—')}</b></div><div class="metric-row"><span>Change</span><b>${esc(eventLabel(e.event_type))}</b></div></section></aside></div><div class="evidence-nav">${safe>0?`<a class="btn" href="${evidenceHref(c,safe-1)}">← Previous evidence</a>`:'<span></span>'}${safe<events.length-1?`<a class="btn" href="${evidenceHref(c,safe+1)}">Next evidence →</a>`:'<span></span>'}</div></div>`;window.scrollTo(0,0)}
    function detail(c,anchor=''){
      setActiveNav('');const ai=c.ai_research_view||{};
      app.innerHTML=`<div class="page"><button class="back" onclick="goHome()">← Back to Today's Clues</button><section class="detail-hero"><div class="eyebrow">${esc(c.theme)}</div><h1>${esc(c.title)}</h1><p class="detail-summary">${esc(c.one_line_thesis)}</p><div class="detail-meta"><span class="status ${esc(c.status)}">${esc(c.status)}</span><span>First seen ${esc(c.first_seen)}</span><span>Updated ${esc(c.last_updated)}</span></div><div class="chips" style="margin-top:13px">${authors(c)}</div></section>
        <div class="detail-grid"><div class="detail-main"><section class="panel"><h2>WHY IT MATTERS</h2><p>${esc(c.why_this_matters)}</p><h3>CAUSAL CHAIN</h3><div class="logic">${arr(c.full_logic_chain).map((x,i)=>`${i?'<i>→</i>':''}<span>${esc(x)}</span>`).join('')}</div></section>
        <section class="panel" id="timeline"><h2>CLUE TIMELINE</h2><div class="timeline">${arr(c.timeline).map((e,index)=>event(c,e,index)).join('')}</div>${c.collapsed_repeat_count?`<p style="margin:16px 0 0">${c.collapsed_repeat_count} repeat / no-new-information nodes are collapsed.</p>`:''}</section>
        <section class="panel"><h2>QUOTE CHAIN</h2>${quoteChain(c).length?quoteChain(c).map(q=>`<div class="quote"><b>${esc(q.quoted_by)} quoted ${esc(q.author||'source')} · ${esc(q.date||q.quoted_at)}</b><br>${esc(q.text||q.url)}</div>`).join(''):'<p>No retained quote-chain node for this clue.</p>'}</section>
        <section class="panel"><h2>MEDIA EVIDENCE</h2>${clueMedia(c).length?`<div class="media-grid">${clueMedia(c).map(media).join('')}</div>`:'<p>No completed media artifact is attached to this clue.</p>'}</section>
        <section class="panel" id="evidence"><h2>EVIDENCE CHAIN</h2><div class="metric-row"><span>Social mentions</span><b>${c.social_mentions}</b></div><div class="metric-row"><span>Independent evidence roots</span><b>${c.independent_evidence_roots}</b></div>${evidenceRoots(c)}<h3>AI INFERENCE</h3><p>${esc(c.ai_initial_view)}</p></section>
        <section class="panel"><h2>AUTHOR THESIS EVOLUTION</h2><div class="evolution">${arr(c.author_evolution).map(a=>`<div class="author-line"><b><a href="/#author/${encodeURIComponent(a.author)}">${esc(a.author)}</a></b> <span class="chip">${esc(a.current_confidence)}</span><div class="views"><p><b>Initial</b><br>${esc(a.initial_view)}</p><div class="arrow">→</div><p><b>Current</b><br>${esc(a.current_view)}</p></div></div>`).join('')}</div></section>
        <section class="panel"><h2>CONSENSUS / DISAGREEMENT</h2><div class="brief-grid"><div><h3>WHERE THEY AGREE</h3>${list(c.where_they_agree)}</div><div><h3>WHERE THEY DISAGREE</h3>${list(c.where_they_disagree)}</div></div></section>
        <section class="panel"><h2>POSITIVE / NEGATIVE EXPOSURE</h2><div class="brief-grid"><div><h3>POSITIVE EXPOSURE</h3>${exposureList(c.positive_exposure)}</div><div><h3>NEGATIVE EXPOSURE</h3>${exposureList(c.negative_exposure)}</div></div></section>
        <section class="panel"><h2>AI RESEARCH VIEW</h2><div class="ai-grid"><div class="ai-block right"><h3>WHAT LOOKS RIGHT</h3>${list(ai.what_looks_right)}</div><div class="ai-block wrong"><h3>WHAT MAY BE WRONG</h3>${list(ai.what_may_be_wrong)}</div><div class="ai-block unknown"><h3>WHAT IS STILL UNKNOWN</h3>${list(ai.what_is_still_unknown)}</div><div class="ai-block"><h3>SECOND-ORDER EFFECTS</h3>${list(ai.second_order_effects)}</div><div class="ai-block next"><h3>WHAT TO RESEARCH NEXT</h3>${list(ai.what_to_research_next)}</div></div></section></div>
        <aside class="detail-side"><section class="panel"><h2>AT A GLANCE</h2><div class="metric-row"><span>Status</span><b>${esc(c.status)}</b></div><div class="metric-row"><span>First seen</span><b>${esc(c.first_seen)}</b></div><div class="metric-row"><span>Updated</span><b>${esc(c.last_updated)}</b></div><div class="metric-row"><span>Authors</span><b>${arr(c.authors).length}</b></div></section><section class="panel"><h2>RELATED COMPANIES</h2>${arr(c.related_companies).length?arr(c.related_companies).map(x=>`<div class="evidence-root"><a href="/companies/?ticker=${encodeURIComponent(x.ticker||x.name)}"><b>${esc(x.ticker||x.name)}</b></a><p>${esc(x.mechanism)}</p></div>`).join(''):'<p>No clear public equity expression.</p>'}</section><section class="panel"><h2>WHY RECOMMENDED</h2>${list(c.recommendation_reasons)}</section></aside></div></div>`;
      window.scrollTo(0,0);if(anchor)setTimeout(()=>document.getElementById(anchor)?.scrollIntoView(),20);
    }
    function authorPage(name){
      setActiveNav('authors');const rows=CLUES.filter(c=>arr(c.authors).includes(name));
      app.innerHTML=`<div class="page"><button class="back" onclick="goHome()">← Back to Today's Clues</button><div class="profile-head"><div class="avatar">${esc(name.slice(0,1).toUpperCase())}</div><div><div class="eyebrow">CURRENT RESEARCH LINES</div><h1>${esc(name)}</h1></div></div>${rows.map(c=>{const evo=arr(c.author_evolution).find(a=>a.author===name)||{};return `<article class="research-line"><h3><a href="/#clue/${encodeURIComponent(c.clue_id)}">${esc(c.title)}</a></h3><div class="meta"><span class="status ${esc(c.status)}">${esc(c.status)}</span><span>First seen ${esc(evo.first_seen||c.first_seen)}</span><span>Updated ${esc(evo.last_updated||c.last_updated)}</span></div><p><b>Current view:</b> ${esc(evo.current_view||c.one_line_thesis)}</p><p><b>Latest change:</b> ${esc(c.what_changed)}</p></article>`}).join('')||'<div class="empty">No current research lines.</div>'}</div>`;window.scrollTo(0,0);
    }
    function themePage(theme){setActiveNav('themes');const rows=CLUES.filter(c=>c.theme===theme);const active=[...new Set(rows.flatMap(c=>arr(c.authors)))];app.innerHTML=`<div class="page"><button class="back" onclick="goHome()">← Back to Today's Clues</button><div class="profile-head"><div class="avatar">#</div><div><div class="eyebrow">CURRENT CLUES</div><h1>${esc(theme)}</h1></div></div><section class="panel"><h2>ACTIVE AUTHORS</h2><div class="chips">${active.map(a=>`<a class="chip" href="/#author/${encodeURIComponent(a)}">${esc(a)}</a>`).join('')}</div></section>${rows.map(compactLine).join('')}</div>`;window.scrollTo(0,0)}
    function showAuthorIndex(){setActiveNav('authors');const names=[...new Set(CLUES.flatMap(c=>arr(c.authors)))].sort();app.innerHTML=`<div class="page"><div class="profile-head"><div class="avatar">A</div><div><div class="eyebrow">RESEARCH NETWORK</div><h1>作者</h1></div></div><div class="chips">${names.map(a=>`<a class="chip" href="/#author/${encodeURIComponent(a)}">${esc(a)}</a>`).join('')}</div></div>`;window.scrollTo(0,0)}
    function showThemeIndex(){setActiveNav('themes');const names=[...new Set(CLUES.map(c=>c.theme))];app.innerHTML=`<div class="page"><div class="profile-head"><div class="avatar">#</div><div><div class="eyebrow">RESEARCH MAP</div><h1>主题</h1></div></div><div class="chips">${names.map(a=>`<a class="chip" href="/#theme/${encodeURIComponent(a)}">${esc(a)}</a>`).join('')}</div></div>`;window.scrollTo(0,0)}
    function companyRows(name){return CLUES.map(c=>({c,x:arr(c.related_companies).find(x=>(x.ticker||x.name)===name)})).filter(row=>row.x)}
    function companyPage(name){setActiveNav('companies');const rows=companyRows(name);const display=rows[0]?.x?.name||name;app.innerHTML=`<div class="page"><a class="back" href="/companies/">← All Companies</a><div class="profile-head"><div class="avatar">$</div><div><div class="eyebrow">COMPANY RESEARCH MAP</div><h1>${esc(display)}</h1><div class="meta"><span>${esc(name)}</span><span>${rows.length} active clues</span></div></div></div><div class="company-map">${rows.map(({c,x})=>`<article class="company-card"><h2><a href="/#clue/${encodeURIComponent(c.clue_id)}">${esc(c.title)}</a></h2><div class="meta"><span class="status ${esc(c.status)}">${esc(c.status)}</span><span>${esc(c.theme)}</span><span>${esc(c.first_seen)} → ${esc(c.last_updated)}</span></div><p class="mechanism"><b>Why mentioned:</b> ${esc(x.mechanism||c.one_line_thesis)}</p><div class="brief-grid"><div class="brief"><b>ACTIVE CLUE</b><p>${esc(c.one_line_thesis)}</p></div><div class="brief"><b>WHAT CHANGED</b><p>${esc(c.what_changed)}</p></div></div><div class="card-foot"><a class="btn" href="/#clue/${encodeURIComponent(c.clue_id)}">View Clue</a><a class="btn primary" href="${evidenceHref(c)}">View Evidence</a></div></article>`).join('')||'<div class="empty">No current research lines.</div>'}</div></div>`;window.scrollTo(0,0)}
    function showCompanyIndex(){setActiveNav('companies');const entries=[...new Set(CLUES.flatMap(c=>arr(c.related_companies).map(x=>x.ticker||x.name)).filter(Boolean))].sort().map(name=>({name,rows:companyRows(name)}));app.innerHTML=`<div class="page"><div class="profile-head"><div class="avatar">$</div><div><div class="eyebrow">COMPANY RESEARCH MAP</div><h1>标的研究地图</h1></div></div><div class="company-index">${entries.map(({name,rows})=>`<article class="company-card"><h2><a href="/companies/?ticker=${encodeURIComponent(name)}">${esc(rows[0]?.x?.name||name)}</a></h2><div class="meta"><span>${esc(name)}</span><span>${rows.length} active clues</span></div><p class="mechanism">${esc(rows[0]?.x?.mechanism||'Open the company map to see why it appears in current research.')}</p><a class="evidence-link" href="/companies/?ticker=${encodeURIComponent(name)}">Open research map →</a></article>`).join('')}</div></div>`;window.scrollTo(0,0)}
    function goHome(){history.pushState(null,'','/');home()}
    function route(){const path=location.pathname.replace(/\/+$/,'')||'/';const segments=path.split('/').filter(Boolean);const leaf=segments.at(-1)==='index.html'?segments.at(-2):segments.at(-1);const query=new URLSearchParams(location.search);if(leaf==='research-changes')return showResearchChanges();if(leaf==='evidence'){const clueId=query.get('clue'),eventIndex=query.get('event');const c=CLUES.find(x=>x.clue_id===clueId);return c?evidenceDetail(c,eventIndex):showEvidenceIndex()}if(leaf==='companies'){const ticker=query.get('ticker');return ticker?companyPage(ticker):showCompanyIndex()}const parts=location.hash.slice(1).split('/').map(decodeURIComponent);if(parts[0]==='clue'){const c=CLUES.find(x=>x.clue_id===parts[1]);return c?detail(c,parts[2]==='posts'?'timeline':parts[2]||''):home()}if(parts[0]==='all')return showAllClues();if(parts[0]==='changes')return showResearchChanges();if(parts[0]==='authors')return showAuthorIndex();if(parts[0]==='themes')return showThemeIndex();if(parts[0]==='companies')return showCompanyIndex();if(parts[0]==='author')return authorPage(parts[1]);if(parts[0]==='theme')return themePage(parts[1]);if(parts[0]==='company')return companyPage(parts[1]);home()}
    addEventListener('hashchange',route);route();
  </script>
</body>
</html>
