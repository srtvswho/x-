<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SignalBoard · Research Clue Desk</title>
  <style>
    :root{
      --paper:#f4f5f2;--card:#fff;--ink:#17201d;--muted:#68716d;--faint:#929a96;
      --line:#dfe3df;--line2:#eceeeb;--green:#247454;--green-bg:#e8f3ed;
      --blue:#315da5;--blue-bg:#eaf0fa;--amber:#966a18;--amber-bg:#fbf1db;
      --red:#a54848;--red-bg:#f8eaea;--gray:#707874;--gray-bg:#eef0ee;
      --shadow:0 16px 42px rgba(24,38,31,.07);--radius:17px;
      --serif:Georgia,"Songti SC","Noto Serif CJK SC",serif;
      --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
    button,a{font:inherit}a{color:inherit}.shell{max-width:1240px;margin:auto;padding:0 28px 64px}
    .topbar{height:66px;display:flex;align-items:center;border-bottom:1px solid var(--line);gap:18px}
    .brand{font:700 13px/1 var(--mono);letter-spacing:.12em}.brand i{font-style:normal;color:var(--green)}
    .topbar-note{font-size:11px;color:var(--faint);margin-left:auto}.mini-nav{display:flex;gap:8px}.mini-nav button{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:8px}
    .hero{padding:58px 0 31px;border-bottom:1px solid var(--line)}.eyebrow{font:700 10px/1 var(--mono);letter-spacing:.16em;color:var(--green);text-transform:uppercase}.hero h1{font:500 clamp(35px,6vw,68px)/1.04 var(--serif);letter-spacing:-.035em;margin:13px 0 14px;max-width:850px}.hero p{font-size:16px;color:var(--muted);max-width:700px;margin:0}.hero-meta{display:flex;flex-wrap:wrap;gap:22px;margin-top:27px}.hero-meta div{min-width:110px}.hero-meta b{display:block;font:600 22px/1.2 var(--serif)}.hero-meta span{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
    .home-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:30px;align-items:start;margin-top:30px}.main{min-width:0}.rail{position:sticky;top:18px}
    .rail-card{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.68);padding:17px}.rail-title{font:700 10px/1 var(--mono);letter-spacing:.12em;color:var(--faint);margin-bottom:12px}.rail a{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line2);text-decoration:none;font-size:11px;line-height:1.35}.rail a:first-of-type{border-top:0}.rail a b{font:500 10px/1.4 var(--mono);color:var(--faint)}
    .filters{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 26px}.filter{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 11px;color:var(--muted);font-size:11px;cursor:pointer}.filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .section{margin-bottom:35px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line)}.section-head h2{font:700 11px/1 var(--mono);letter-spacing:.14em;margin:0}.section-head span{font-size:10px;color:var(--faint)}
    .clue-list{display:grid;gap:12px}.clue-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:23px 24px;box-shadow:0 7px 25px rgba(27,39,33,.035);transition:transform .18s,box-shadow .18s}.clue-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .clue-top{display:flex;gap:15px;align-items:flex-start}.rank{font:500 10px/1.4 var(--mono);color:var(--faint);padding-top:4px}.clue-title{font:600 23px/1.22 var(--serif);letter-spacing:-.015em;margin:0}.meta{display:flex;gap:7px 13px;flex-wrap:wrap;margin-top:7px;color:var(--faint);font-size:10.5px}.status{display:inline-flex;border-radius:99px;padding:4px 7px;font:700 9px/1 var(--mono);letter-spacing:.045em}.status.NEW,.status.BUILDING{color:var(--amber);background:var(--amber-bg)}.status.STRENGTHENING,.status.MATURE{color:var(--green);background:var(--green-bg)}.status.WEAKENING{color:var(--amber);background:var(--amber-bg)}.status.CONTRADICTED{color:var(--red);background:var(--red-bg)}.status.DORMANT{color:var(--gray);background:var(--gray-bg)}
    .confidence{margin-left:auto;text-align:right}.confidence b{display:block;font:700 10px/1 var(--mono);letter-spacing:.08em}.confidence span{font-size:9px;color:var(--faint)}
    .thesis{font-size:15.5px;font-weight:590;line-height:1.55;margin:19px 0 16px}.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.brief{border-top:1px solid var(--line2);padding-top:10px}.brief b{display:block;font:700 9px/1.3 var(--mono);letter-spacing:.1em;color:var(--faint);margin-bottom:5px}.brief p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.logic{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin:14px 0}.logic span{font-size:10.5px;background:#f7f8f6;border:1px solid var(--line2);border-radius:99px;padding:3px 7px}.logic i{font-style:normal;color:var(--faint)}
    .chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:10px;border:1px solid var(--line);border-radius:7px;padding:3px 7px;background:#fff;color:var(--muted)}a.chip{text-decoration:none}.chip.blue{color:var(--blue);background:var(--blue-bg);border-color:transparent}.chip.red{color:var(--red);background:var(--red-bg);border-color:transparent}.chip.green{color:var(--green);background:var(--green-bg);border-color:transparent}
    .card-foot{display:flex;align-items:center;gap:9px;margin-top:17px}.recommend{font-size:10.5px;color:var(--faint);margin-right:auto}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer;font-size:10.5px;color:var(--ink);text-decoration:none}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn:hover{border-color:#aeb7b1}
    .page{padding-top:32px}.back{border:0;background:transparent;padding:8px 0;color:var(--muted);cursor:pointer;font-size:12px}.detail-hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 38px;margin-top:10px;box-shadow:var(--shadow)}.detail-hero h1{font:500 clamp(32px,5vw,54px)/1.08 var(--serif);letter-spacing:-.035em;margin:12px 0 15px;max-width:920px}.detail-summary{font-size:18px;font-weight:570;line-height:1.55;max-width:900px}.detail-meta{display:flex;flex-wrap:wrap;gap:9px 18px;margin-top:20px;color:var(--muted);font-size:11px}
    .detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:28px;margin-top:28px}.detail-main{min-width:0}.detail-side{min-width:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:15px}.panel h2{font:700 10px/1 var(--mono);letter-spacing:.13em;margin:0 0 17px}.panel h3{font-size:12px;margin:15px 0 7px}.panel p{color:var(--muted);margin:0 0 10px}.panel ul,.panel ol{margin:0;padding-left:20px;color:var(--muted)}.panel li{margin:7px 0}.metric-row{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid var(--line2);padding:10px 0;font-size:11px}.metric-row:first-of-type{border-top:0}.metric-row span{color:var(--muted)}
    .timeline{position:relative;margin-left:8px}.timeline:before{content:"";position:absolute;left:8px;top:7px;bottom:7px;width:1px;background:var(--line)}.event{position:relative;padding:0 0 25px 37px}.event:last-child{padding-bottom:0}.event:before{content:"";position:absolute;left:3px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--blue)}.event.CONTRADICTION:before,.event.NEW_RISK:before{border-color:var(--red)}.event.THESIS_ORIGIN:before{border-color:var(--green)}.event-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.event-date{font:650 10px/1 var(--mono);color:var(--faint)}.event-type{font:700 9px/1 var(--mono);letter-spacing:.07em;color:var(--blue)}.event h3{font-size:13px;margin:8px 0 4px}.event p{font-size:12px;line-height:1.55;margin:4px 0;color:var(--muted)}.event .meaning{border-left:2px solid var(--line);padding-left:9px}.post-link{font-size:10px;color:var(--blue);text-decoration:none}.quote{margin:8px 0 0;border-left:2px solid var(--line);padding:6px 10px;background:#f8f9f7;font-size:11px;color:var(--muted)}
    .media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.media-card{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fafbf9}.media-card img{display:block;width:100%;height:150px;object-fit:cover;background:#eef0ed}.media-card div{padding:9px;font-size:10.5px;color:var(--muted)}
    .evidence-root{padding:10px 0;border-top:1px solid var(--line2)}.evidence-root:first-of-type{border-top:0}.evidence-root a{font-weight:650;font-size:12px;text-decoration:none}.evidence-root p{font-size:11px;margin:3px 0}.layer{font:700 8.5px/1 var(--mono);letter-spacing:.08em;color:var(--blue)}
    .evolution{display:grid;gap:10px}.author-line{border:1px solid var(--line2);border-radius:11px;padding:13px}.author-line b{font-size:12px}.author-line .views{display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:8px;margin-top:8px}.author-line p{font-size:11px;margin:0}.arrow{text-align:center;color:var(--faint)}
    .ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ai-block{border:1px solid var(--line2);border-radius:11px;padding:13px}.ai-block h3{font:700 9px/1 var(--mono);letter-spacing:.08em;margin:0 0 8px}.ai-block ul{font-size:11.5px}.ai-block.right h3{color:var(--green)}.ai-block.wrong h3{color:var(--red)}.ai-block.unknown h3{color:var(--amber)}.ai-block.next{grid-column:1/-1}
    .profile-head{display:flex;gap:12px;align-items:center;margin-bottom:22px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:white;font:600 18px/1 var(--serif)}.profile-head h1{font:500 35px/1.1 var(--serif);margin:0}.research-line{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:9px}.research-line h3{font:600 18px/1.3 var(--serif);margin:0}.empty{padding:50px;text-align:center;color:var(--muted)}
    .footer{border-top:1px solid var(--line);margin-top:50px;padding-top:18px;color:var(--faint);font-size:10.5px;display:flex;justify-content:space-between;gap:20px}
    @media(max-width:920px){.home-layout,.detail-grid{grid-template-columns:1fr}.rail{display:none}.brief-grid,.ai-grid{grid-template-columns:1fr}.ai-block.next{grid-column:auto}.detail-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-side .panel{margin:0}.shell{padding:0 18px 45px}}
    @media(max-width:620px){.shell{padding:0 13px 38px}.topbar-note,.mini-nav{display:none}.hero{padding-top:38px}.hero h1{font-size:41px}.clue-card{padding:18px 16px}.clue-title{font-size:20px}.confidence{display:none}.brief-grid,.detail-side,.media-grid{grid-template-columns:1fr}.actions{width:100%}.btn{flex:1;text-align:center}.card-foot{flex-wrap:wrap}.detail-hero{padding:25px 19px}.detail-hero h1{font-size:35px}.panel{padding:18px 15px}.author-line .views{grid-template-columns:1fr}.arrow{text-align:left}.footer{display:block}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">SIGNAL<i>BOARD</i></div>
      <nav class="mini-nav"><button onclick="goHome()">Research Clues</button><button onclick="showThemeIndex()">Themes</button><button onclick="showAuthorIndex()">Authors</button></nav>
      <div class="topbar-note">Research first · conclusions separated from evidence</div>
    </header>
    <main id="app"></main>
    <footer class="footer"><span>Research clues are starting points, not investment recommendations.</span><span>SignalBoard · Research Clue Desk Preview v1.6</span></footer>
  </div>
  <script id="clue-data" type="application/json">__RESEARCH_CLUES__</script>
  <script>
    const DATA=JSON.parse(document.getElementById('clue-data').textContent),CLUES=DATA.clues||[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const arr=x=>Array.isArray(x)?x:[];
    const app=document.getElementById('app');
    const groupFor=s=>s==='NEW'?'new':s==='CONTRADICTED'?'risk':['STRENGTHENING','WEAKENING','MATURE'].includes(s)?'updates':'developing';
    const sectionNames={new:'NEW CLUES',developing:'DEVELOPING CLUES',updates:'IMPORTANT UPDATES',risk:'CONTRADICTED / RISK'};
    const short=(s,n=190)=>String(s||'').length>n?String(s).slice(0,n).replace(/[^。；;,.]*$/,'')+'…':String(s||'');
    const authors=c=>arr(c.authors).slice(0,4).map(a=>`<a class="chip" href="#author/${encodeURIComponent(a)}">${esc(a)}</a>`).join('');
    const companies=c=>arr(c.related_companies).slice(0,6).map(x=>`<span class="chip ${x.exposure==='POSITIVE'?'green':x.exposure==='NEGATIVE'?'red':''}">${esc(x.ticker||x.name)}</span>`).join('')||'<span class="chip">NO CLEAR PUBLIC EQUITY EXPRESSION</span>';
    function card(c){
      const logic=arr(c.short_logic_chain).map((x,i)=>`${i?'<i>→</i>':''}<span>${esc(short(x,80))}</span>`).join('');
      return `<article class="clue-card" data-group="${groupFor(c.status)}"><div class="clue-top"><span class="rank">${String(c.priority).padStart(2,'0')}</span><div><h3 class="clue-title">${esc(c.title)}</h3><div class="meta"><span class="status ${esc(c.status)}">${esc(c.status)}</span><a href="#theme/${encodeURIComponent(c.theme)}">${esc(c.theme)}</a><span>${esc(c.first_seen)} → ${esc(c.last_updated)}</span><span>${esc(c.timeline_completeness)} TIMELINE</span></div></div><div class="confidence"><b>${esc(c.confidence)}</b><span>CONFIDENCE</span></div></div>
        <p class="thesis">${esc(c.one_line_thesis)}</p><div class="brief-grid"><div class="brief"><b>WHY THIS MATTERS</b><p>${esc(short(c.why_this_matters,260))}</p></div><div class="brief"><b>WHAT CHANGED</b><p>${esc(c.what_changed)}</p></div></div>
        <div class="logic">${logic}</div><div class="brief-grid"><div class="brief"><b>RELATED COMPANIES</b><div class="chips">${companies(c)}</div></div><div class="brief"><b>AI INITIAL VIEW</b><p>${esc(short(c.ai_initial_view,245))}</p></div></div>
        <div class="card-foot"><div class="recommend">Recommended: ${esc(arr(c.recommendation_reasons).join(' · '))}</div><div class="actions"><a class="btn primary" href="#clue/${encodeURIComponent(c.clue_id)}">View Full Clue</a><a class="btn" href="#clue/${encodeURIComponent(c.clue_id)}/evidence">View Evidence</a><a class="btn" href="#clue/${encodeURIComponent(c.clue_id)}/posts">View Posts</a></div></div></article>`;
    }
    function home(filter='all'){
      const counts={all:CLUES.length,new:0,developing:0,updates:0,risk:0};CLUES.forEach(c=>counts[groupFor(c.status)]++);
      const visible=filter==='all'?CLUES:CLUES.filter(c=>groupFor(c.status)===filter);
      const groups=['updates','new','developing','risk'].map(k=>({k,rows:visible.filter(c=>groupFor(c.status)===k)})).filter(x=>x.rows.length);
      app.innerHTML=`<section class="hero"><div class="eyebrow">AI RESEARCH CLUE DESK</div><h1>Today's Research Clues</h1><p>从四万多条 Post、引用链、图片和外部资料中，保留今天真正值得继续研究的线索。先看变化，再决定是否进入证据链。</p><div class="hero-meta"><div><b>${CLUES.length}</b><span>Current clues</span></div><div><b>${CLUES.filter(c=>c.status==='STRENGTHENING').length}</b><span>Strengthening</span></div><div><b>${CLUES.filter(c=>c.status==='CONTRADICTED').length}</b><span>Contradicted</span></div><div><b>${CLUES.filter(c=>c.media_evidence_count>0).length}</b><span>With media</span></div></div></section>
        <div class="home-layout"><div class="main"><div class="filters">${[['all','ALL'],['new','NEW'],['developing','DEVELOPING'],['updates','IMPORTANT UPDATES'],['risk','RISK']].map(([k,l])=>`<button class="filter ${filter===k?'active':''}" onclick="home('${k}')">${l} · ${counts[k]}</button>`).join('')}</div>${groups.map(g=>`<section class="section"><div class="section-head"><h2>${sectionNames[g.k]}</h2><span>${g.rows.length} research lines</span></div><div class="clue-list">${g.rows.map(card).join('')}</div></section>`).join('')}</div><aside class="rail"><div class="rail-card"><div class="rail-title">TODAY'S INDEX</div>${CLUES.map(c=>`<a href="#clue/${encodeURIComponent(c.clue_id)}"><b>${String(c.priority).padStart(2,'0')}</b><span>${esc(c.title)}</span></a>`).join('')}</div></aside></div>`;
      window.scrollTo(0,0);
    }
    function evidenceRoots(c){
      const layers=['PRIMARY_EVIDENCE','SECONDARY_EVIDENCE','AUTHOR_INTERPRETATION'];
      return layers.map(layer=>{const roots=arr(c.evidence_roots).filter(x=>x.layer===layer);if(!roots.length)return'';return `<h3>${layer.replaceAll('_',' ')}</h3>${roots.map(r=>`<div class="evidence-root"><span class="layer">${esc(r.publisher||layer)}</span><br>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noreferrer">${esc(r.title)}</a>`:`<b>${esc(r.title)}</b>`}<p>${esc(r.finding||'Source retained for independent-root deduplication.')}</p></div>`).join('')}`}).join('');
    }
    function media(m){return `<div class="media-card">${m.thumbnail_url?`<img src="${esc(m.thumbnail_url)}" alt="Evidence media" loading="lazy" onerror="this.style.display='none'">`:''}<div><b>${esc(m.detected_source||m.media_type||'Media evidence')}</b><br>${esc(m.summary||'Existing completed media analysis')}</div></div>`}
    function event(e){return `<article class="event ${esc(e.event_type)}"><div class="event-top"><span class="event-date">${esc(e.date)}</span><span class="event-type">${esc(e.event_type)}</span><a class="chip" href="#author/${encodeURIComponent(e.author)}">${esc(e.author)}</a></div><h3>${esc(e.what_changed)}</h3>${e.post?`<p>${esc(short(e.post,360))}</p>`:''}${arr(e.claims).map(x=>`<p><b>Claim:</b> ${esc(x)}</p>`).join('')}<p class="meaning"><b>AI interpretation:</b> ${esc(e.ai_interpretation)}</p>${e.post_url?`<a class="post-link" href="${esc(e.post_url)}" target="_blank" rel="noreferrer">Open original post ↗</a>`:''}${arr(e.quoted_posts).map(q=>`<div class="quote"><b>Quoted · ${esc(q.author)} ${esc(q.date)}</b><br>${esc(q.text||q.url)}</div>`).join('')}${arr(e.media).length?`<div class="media-grid">${e.media.map(media).join('')}</div>`:''}</article>`}
    function list(items){return `<ul>${arr(items).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
    function detail(c,anchor=''){
      const ai=c.ai_research_view||{};
      app.innerHTML=`<div class="page"><button class="back" onclick="goHome()">← Back to Today's Clues</button><section class="detail-hero"><div class="eyebrow">${esc(c.theme)}</div><h1>${esc(c.title)}</h1><p class="detail-summary">${esc(c.one_line_thesis)}</p><div class="detail-meta"><span class="status ${esc(c.status)}">${esc(c.status)}</span><span>${esc(c.current_state)}</span><span>First seen ${esc(c.first_seen)}</span><span>Updated ${esc(c.last_updated)}</span><span>${esc(c.confidence)} confidence</span></div><div class="chips" style="margin-top:13px">${authors(c)}</div></section>
        <div class="detail-grid"><div class="detail-main"><section class="panel"><h2>WHY IT MATTERS</h2><p>${esc(c.why_this_matters)}</p><h3>CAUSAL CHAIN</h3><div class="logic">${arr(c.full_logic_chain).map((x,i)=>`${i?'<i>→</i>':''}<span>${esc(x)}</span>`).join('')}</div></section>
        <section class="panel" id="timeline"><h2>CLUE TIMELINE</h2><div class="timeline">${arr(c.timeline).map(event).join('')}</div>${c.collapsed_repeat_count?`<p style="margin:16px 0 0">${c.collapsed_repeat_count} repeat / no-new-information nodes are collapsed.</p>`:''}</section>
        <section class="panel" id="evidence"><h2>EVIDENCE CHAIN</h2><div class="metric-row"><span>Social mentions</span><b>${c.social_mentions}</b></div><div class="metric-row"><span>Independent evidence roots</span><b>${c.independent_evidence_roots}</b></div>${evidenceRoots(c)}<h3>AI INFERENCE</h3><p>${esc(c.ai_initial_view)}</p></section>
        <section class="panel"><h2>AUTHOR THESIS EVOLUTION</h2><div class="evolution">${arr(c.author_evolution).map(a=>`<div class="author-line"><b><a href="#author/${encodeURIComponent(a.author)}">${esc(a.author)}</a></b> <span class="chip">${esc(a.current_confidence)}</span><div class="views"><p><b>Initial</b><br>${esc(a.initial_view)}</p><div class="arrow">→</div><p><b>Current</b><br>${esc(a.current_view)}</p></div></div>`).join('')}</div></section>
        <section class="panel"><h2>CONSENSUS / DISAGREEMENT</h2><div class="brief-grid"><div><h3>WHERE THEY AGREE</h3>${list(c.where_they_agree)}</div><div><h3>WHERE THEY DISAGREE</h3>${list(c.where_they_disagree)}</div></div></section>
        <section class="panel"><h2>AI RESEARCH VIEW</h2><div class="ai-grid"><div class="ai-block right"><h3>WHAT LOOKS RIGHT</h3>${list(ai.what_looks_right)}</div><div class="ai-block wrong"><h3>WHAT MAY BE WRONG</h3>${list(ai.what_may_be_wrong)}</div><div class="ai-block unknown"><h3>WHAT IS STILL UNKNOWN</h3>${list(ai.what_is_still_unknown)}</div><div class="ai-block"><h3>SECOND-ORDER EFFECTS</h3>${list(ai.second_order_effects)}</div><div class="ai-block next"><h3>WHAT TO RESEARCH NEXT</h3>${list(ai.what_to_research_next)}</div></div></section></div>
        <aside class="detail-side"><section class="panel"><h2>RESEARCH STATE</h2><div class="metric-row"><span>Status</span><b>${esc(c.status)}</b></div><div class="metric-row"><span>Completeness</span><b>${c.clue_completeness.completed}/${c.clue_completeness.total}</b></div><div class="metric-row"><span>Timeline</span><b>${esc(c.timeline_completeness)}</b></div><div class="metric-row"><span>Media evidence</span><b>${c.media_evidence_count}</b></div></section><section class="panel"><h2>RELATED COMPANIES</h2>${arr(c.related_companies).length?arr(c.related_companies).map(x=>`<div class="evidence-root"><b>${esc(x.ticker||x.name)}</b> <span class="chip ${x.exposure==='POSITIVE'?'green':x.exposure==='NEGATIVE'?'red':''}">${esc(x.exposure)}</span><p>${esc(x.mechanism)}</p></div>`).join(''):'<p>NO CLEAR PUBLIC EQUITY EXPRESSION</p>'}</section><section class="panel"><h2>WHY RECOMMENDED</h2>${list(c.recommendation_reasons)}</section></aside></div></div>`;
      window.scrollTo(0,0);if(anchor)setTimeout(()=>document.getElementById(anchor)?.scrollIntoView(),20);
    }
    function authorPage(name){
      const rows=CLUES.filter(c=>arr(c.authors).includes(name));
      app.innerHTML=`<div class="page"><button class="back" onclick="goHome()">← Back to Today's Clues</button><div class="profile-head"><div class="avatar">${esc(name.slice(0,1).toUpperCase())}</div><div><div class="eyebrow">CURRENT RESEARCH LINES</div><h1>${esc(name)}</h1></div></div>${rows.map(c=>{const evo=arr(c.author_evolution).find(a=>a.author===name)||{};return `<article class="research-line"><h3><a href="#clue/${encodeURIComponent(c.clue_id)}">${esc(c.title)}</a></h3><div class="meta"><span class="status ${esc(c.status)}">${esc(c.status)}</span><span>First seen ${esc(evo.first_seen||c.first_seen)}</span><span>Updated ${esc(evo.last_updated||c.last_updated)}</span><span>${esc(evo.current_confidence||c.confidence)} confidence</span></div><p><b>Current view:</b> ${esc(evo.current_view||c.one_line_thesis)}</p><p><b>Latest change:</b> ${esc(c.what_changed)}</p></article>`}).join('')||'<div class="empty">No current research lines.</div>'}</div>`;window.scrollTo(0,0);
    }
    function themePage(theme){const rows=CLUES.filter(c=>c.theme===theme);const active=[...new Set(rows.flatMap(c=>arr(c.authors)))];app.innerHTML=`<div class="page"><button class="back" onclick="goHome()">← Back to Today's Clues</button><div class="profile-head"><div class="avatar">#</div><div><div class="eyebrow">CURRENT CLUES</div><h1>${esc(theme)}</h1></div></div><section class="panel"><h2>ACTIVE AUTHORS</h2><div class="chips">${active.map(a=>`<a class="chip" href="#author/${encodeURIComponent(a)}">${esc(a)}</a>`).join('')}</div></section>${rows.map(card).join('')}</div>`;window.scrollTo(0,0)}
    function showAuthorIndex(){const names=[...new Set(CLUES.flatMap(c=>arr(c.authors)))].sort();app.innerHTML=`<div class="page"><button class="back" onclick="goHome()">← Back</button><div class="profile-head"><div class="avatar">A</div><div><div class="eyebrow">RESEARCH NETWORK</div><h1>Authors</h1></div></div><div class="chips">${names.map(a=>`<a class="chip" href="#author/${encodeURIComponent(a)}">${esc(a)}</a>`).join('')}</div></div>`}
    function showThemeIndex(){const names=[...new Set(CLUES.map(c=>c.theme))];app.innerHTML=`<div class="page"><button class="back" onclick="goHome()">← Back</button><div class="profile-head"><div class="avatar">#</div><div><div class="eyebrow">RESEARCH MAP</div><h1>Themes</h1></div></div><div class="chips">${names.map(a=>`<a class="chip" href="#theme/${encodeURIComponent(a)}">${esc(a)}</a>`).join('')}</div></div>`}
    function goHome(){history.pushState(null,'',location.pathname);home()}
    function route(){const parts=location.hash.slice(1).split('/').map(decodeURIComponent);if(parts[0]==='clue'){const c=CLUES.find(x=>x.clue_id===parts[1]);return c?detail(c,parts[2]==='posts'?'timeline':parts[2]||''):home()}if(parts[0]==='author')return authorPage(parts[1]);if(parts[0]==='theme')return themePage(parts[1]);home()}
    addEventListener('hashchange',route);route();
  </script>
</body>
</html>
